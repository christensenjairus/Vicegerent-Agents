{{- if .Values.models.anthropic.enabled }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mnemosyne-anthropic
  namespace: agentgateway-system
spec:
  ai:
    groups:
      - providers:
          - name: mnemosyne-anthropic
            anthropic: {}
            policies:
              auth:
                secretRef:
                  name: vicegerent-anthropic-secrets
              ai:
                routes:
                  /v1/chat/completions: Completions
                  '*': Passthrough
                {{- include "platform.promptGuard" . | nindent 16 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mnemosyne-anthropic
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mnemosyne-anthropic
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: mnemosyne-anthropic
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
{{- end }}
