{{- if .Values.models.openai.enabled }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai
  namespace: agentgateway-system
spec:
  ai:
    groups:
      - providers:
          - name: openai
            openai: {}
            policies:
              auth:
                secretRef:
                  name: vicegerent-openai-secrets
              ai:
                routes:
                  /v1/responses: Responses
                  /v1/chat/completions: Completions
                  '*': Passthrough
                {{- include "platform.promptGuard" . | nindent 16 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openai
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /openai
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: openai
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
{{- end }}
