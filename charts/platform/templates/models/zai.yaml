{{- if .Values.models.zai.enabled }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: zai
  namespace: agentgateway-system
spec:
  ai:
    groups:
      - providers:
          - name: zai
            openai: {}
            host: api.z.ai
            port: 443
            pathPrefix: /api/paas/v4
            policies:
              auth:
                secretRef:
                  name: vicegerent-zai-secrets
              tls:
                sni: api.z.ai
              ai:
                routes:
                  /api/paas/v4/chat/completions: Completions
                  '*': Passthrough
                {{- include "platform.promptGuard" . | nindent 16 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zai
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /zai
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: zai
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
{{- end }}
