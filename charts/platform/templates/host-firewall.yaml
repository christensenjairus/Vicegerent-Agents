---
# Denies host/remote-node egress for data-plane namespaces that never need the
# API server. kube-system/controller namespaces and agent-sandbox are excluded:
# on Kind the kube-apiserver runs on the host node, and agent-sandbox's restart
# Job needs it (the sandbox pod itself is already denied via its own policy).
# enableDefaultDeny is false: this only ADDS a deny and must not flip these
# endpoints (e.g. cerbos) into default-deny egress.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-host-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values: [egress-proxy, searxng, cerbos]
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toEntities: [host, remote-node]
