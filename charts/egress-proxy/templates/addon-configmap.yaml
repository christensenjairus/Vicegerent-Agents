---
# mitmproxy scrubbing + enforcement addon.
#
# ALL sandbox outbound traffic (internal cluster services + internet) flows through
# this proxy. Secrets in headers, bodies, and URL path/query are scrubbed before
# forwarding. Pattern-based scrubbing does NOT cover encoded forms (base64, hex) —
# the FQDN allowlist is the primary external control.
#
# Secret patterns (REDACT_PATTERNS) come from the single canonical source
# images/mcp-cerbos-shim/internal/server/secret-patterns.json, injected into this
# ConfigMap at render time via `helm --set-file secretPatterns=…` (the installer and
# scripts/validate.sh both pass it; a bare `helm template` without it fails the
# `required` guard). The Go shim (images/mcp-cerbos-shim) embeds the SAME file via
# //go:embed, so both runtimes compile identical shapes with no hand-sync. Coverage:
# SSH private keys, Slack xox*/xapp-*, Bearer/Basic auth values, AWS, GitHub, GitLab,
# Google, OpenAI, Anthropic, Stripe, Notion, Twilio, npm, generic JWTs, and PII (US
# SSN, Visa/Mastercard/Amex/Discover card numbers, US phone numbers — Email excluded).
# The Authorization header itself (Bearer/Basic/x-api-key) is scrubbed on every
# request regardless of destination: the agent has no legitimate token to send to
# any host (agentgateway injects the real upstream provider key on its own outbound
# leg), so an auth header on an agent request is only ever a secret to strip.
#
# Method enforcement (GET/HEAD only) applies to EXTERNAL destinations only.
# Internal cluster services (*.svc.cluster.local) need POST and are passed through
# after scrubbing. External exceptions are declarative (METHOD_EXEMPTIONS): each
# entry requires host + method + path suffix + content-type to ALL match — any
# one alone is client-controlled and doesn't bound the destination. Multi-tenant
# allowlisted hosts (object storage, CDNs) are further scoped to path prefixes
# via EXTERNAL_PATH_SCOPES, since Cilium's toFQDNs allowlist is host-only.
#
# Response scrubbing: applied to text responses to guard against echo attacks
# (a malicious service echoing back request content including secrets).
#
# WebSocket upgrades are blocked everywhere. Add host to no_proxy in sandbox.yaml
# for trusted WS endpoints (e.g. Slack, which bypasses this proxy entirely).
#
# Accepted risk:
#   - Slack (*.slack.com) bypasses proxy entirely — POST + WebSocket required for
#     Socket Mode. The agent communicates via Slack by design; this is a trusted channel.
#   - SSH (port 22) bypasses proxy — SSH is not HTTP. Content in git pushes (commits,
#     files) is not inspected. The agent's deploy key scope limits blast radius.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-proxy-addon
  namespace: egress-proxy
data:
  scrub.py: |-  # pragma: allowlist secret (the required-message path string below is not a secret)
    import ipaddress
    import json
    import logging
    import re
    from mitmproxy import http

    class _JSONFormatter(logging.Formatter):
        # record.getMessage() resolves %s-style args, so every existing log.info/
        # log.warning call site below needs zero changes for this format switch.
        def format(self, record: logging.LogRecord) -> str:
            return json.dumps({
                "time": self.formatTime(record, "%Y-%m-%dT%H:%M:%S%z"),
                "level": record.levelname,
                "logger": record.name,
                "message": record.getMessage(),
            })

    log = logging.getLogger("egress-proxy")
    # propagate=False + a dedicated handler: mitmproxy's own root-logger handler
    # would otherwise also emit these records in its own (non-JSON) format,
    # doubling every line. This handler is the only place "egress-proxy" records go.
    log.propagate = False
    log.setLevel(logging.INFO)
    _handler = logging.StreamHandler()
    _handler.setFormatter(_JSONFormatter())
    log.addHandler(_handler)

    def _client(flow) -> str:
        # Same client peername mitmproxy's own connect/CONNECT log lines show,
        # so scrub.py's structured lines can be visually/grep-correlated with
        # mitmproxy's native flow-summary output for the same connection.
        try:
            ip, port = flow.client_conn.peername[:2]
            return f"{ip}:{port}"
        except Exception:
            return "-"
    ALLOWED_METHODS = {"GET", "HEAD"}
    # URL length limit — blocks naive base64/hex query-string exfiltration.
    # 2048 chars is generous for all legitimate API/search use cases.
    MAX_URL_LENGTH = 2048

    # Caps the logged MCP-RESPONSE result/error payload. Tool call ARGUMENTS
    # (MCP-CALL, uncapped) are typically small; tool RESULTS can be huge (full
    # file reads, long command output), and this proxy's logs share
    # VictoriaLogs' cluster-wide 5GiB disk cap with three other sources
    # (the victoria-logs stage) — this bounds a pathological
    # single response, not aggregate volume (even 10k calls/day at this cap is
    # a few percent of the budget). Generous on purpose so ordinary tool
    # output is never truncated, only outliers.
    MAX_MCP_RESPONSE_LOG_LENGTH = 32768

    # In-cluster service hostnames — exempt from method/FQDN enforcement only (POST
    # allowed). Secret scrubbing (headers, URL, body) applies to them too; see request().
    INTERNAL_SUFFIXES = (".cluster.local", ".svc")

    # Restricts an already-FQDN-allowlisted host to specific path prefixes.
    # Cilium's toFQDNs is host-only, so a multi-tenant host (object storage,
    # CDNs) must be narrowed here or its allowlist entry grants access to
    # every path any tenant could ever serve. Omit a host for no restriction.
    EXTERNAL_PATH_SCOPES: dict[str, tuple[str, ...]] = {
        # Only proxy.golang.org's zip-download redirect needs this host
        # (golang/go#45248); otherwise it's a universal-tenancy bucket store.
        "storage.googleapis.com": ("/proxy-golang-org-prod/",),
    }

    # Lets specific external destinations bypass the GET/HEAD-only restriction
    # under narrow, fully-specified conditions. Host + method + path suffix +
    # content-type must ALL match — any one alone is client-controlled and
    # doesn't bound the destination.
    METHOD_EXEMPTIONS: list[dict] = [
        {
            "name": "git_upload_pack",
            "hosts": ("github.com",),
            "host_suffixes": (".github.com",),
            "methods": frozenset({"POST"}),
            "path_suffix": "/git-upload-pack",
            "content_type": "application/x-git-upload-pack-request",
        },
    ]

    EXTERNAL_FQDN_ALLOWLIST = {
        {{- range (splitList "," .Values.apexWildcardDomains) }}
        {{- if . }}
        "{{ . }}",
        {{- end }}
        {{- end }}
        {{- range (splitList "," .Values.exactOnlyDomains) }}
        {{- if . }}
        "{{ . }}",
        {{- end }}
        {{- end }}
        "httpbin.io",  # echo service — used by the redaction test suite only.
    }
    EXTERNAL_FQDN_WILDCARD_SUFFIXES = (
        {{- range (splitList "," .Values.apexWildcardDomains) }}
        {{- if . }}
        ".{{ . }}",
        {{- end }}
        {{- end }}
    )

    def _is_allowed_fqdn(host: str) -> bool:
        return host in EXTERNAL_FQDN_ALLOWLIST or any(
            host.endswith(s) for s in EXTERNAL_FQDN_WILDCARD_SUFFIXES
        )

    # Secret patterns, injected from the canonical secret-patterns.json at render
    # time (helm --set-file secretPatterns=…). This is the SAME file the Go shim
    # embeds via //go:embed, so the egress scrubber and the shim compile identical
    # shapes from one source — no hand-sync. `required` fails the render if the flag
    # is missing, so a bare `helm template` can never ship an empty pattern set.
    # re.ASCII gives RE2 parity with the Go regexp engine; `(?i)` is inline in the
    # JSON where a pattern needs case-insensitivity. Pattern-based scrubbing does
    # NOT cover encoded forms (base64, hex); the FQDN allowlist is the primary
    # external control. The r'''…''' quoting is safe because the JSON contains
    # double-quotes but no single-quotes (so ''' cannot appear) and JSON-escapes
    # every backslash — a regex added to the JSON must never contain '''.
    _PATTERN_DEFS = json.loads(r'''
    {{- .Values.secretPatterns | required "egress-proxy: secretPatterns unset — render with helm --set-file secretPatterns=images/mcp-cerbos-shim/internal/server/secret-patterns.json" | nindent 4 }}
    ''')
    REDACT_PATTERNS = [(d["name"], re.compile(d["regex"], re.ASCII)) for d in _PATTERN_DEFS]

    # Authorization Bearer scrubbing — applied to every destination.
    # Match Bearer token permissively — strip everything after "Bearer " regardless of
    # trailing content (avoids header variants like "Bearer token; extra=data" leaking).
    BEARER_PATTERN = re.compile(r"(?i)^(Bearer\s+)\S+")

    # RFC1918, link-local, loopback, CGNAT, and IPv6 private ranges — SSRF protection.
    PRIVATE_NETWORKS = [
        ipaddress.ip_network("10.0.0.0/8"),
        ipaddress.ip_network("172.16.0.0/12"),
        ipaddress.ip_network("192.168.0.0/16"),
        ipaddress.ip_network("169.254.0.0/16"),
        ipaddress.ip_network("127.0.0.0/8"),
        ipaddress.ip_network("100.64.0.0/10"),
        ipaddress.ip_network("::1/128"),
        ipaddress.ip_network("fc00::/7"),
        ipaddress.ip_network("fe80::/10"),
    ]

    # Content types safe to scrub as text; skip binary (images, archives, protobuf, etc.).
    TEXT_CONTENT_TYPES = (
        "text/",
        "application/json",
        "application/xml",
        "application/x-www-form-urlencoded",
        "application/graphql",
        "application/ld+json",
    )
    def _is_internal(host: str) -> bool:
        return any(host.endswith(s) for s in INTERNAL_SUFFIXES)
    def _is_private(host: str) -> bool:
        try:
            addr = ipaddress.ip_address(host)
            return any(addr in net for net in PRIVATE_NETWORKS)
        except ValueError:
            return False  # hostname — Cilium enforces destination boundary
    def _is_text(content_type: str) -> bool:
        ct = content_type.split(";")[0].strip().lower()
        return any(ct.startswith(t) for t in TEXT_CONTENT_TYPES)
    def _matching_method_exemption(flow: http.HTTPFlow) -> dict | None:
        # Every field on an exemption entry must match — host, method, path
        # suffix, AND content-type — before it's granted. Any one alone is
        # client-controlled and doesn't bound the destination.
        host = flow.request.pretty_host
        method = flow.request.method
        path = flow.request.path
        ct = flow.request.headers.get("content-type", "").split(";")[0].strip().lower()
        for rule in METHOD_EXEMPTIONS:
            if host not in rule["hosts"] and not any(host.endswith(s) for s in rule["host_suffixes"]):
                continue
            if method not in rule["methods"]:
                continue
            if not path.endswith(rule["path_suffix"]):
                continue
            if ct != rule["content_type"]:
                continue
            return rule
        return None
    def _path_scope_violation(host: str, path: str) -> bool:
        # True if host has a path-scope entry and path doesn't match any of its
        # allowed prefixes. Hosts with no entry are unrestricted (existing
        # host-only allowlist behavior).
        prefixes = EXTERNAL_PATH_SCOPES.get(host)
        if prefixes is None:
            return False
        return not path.startswith(prefixes)
    def _redact(text: str) -> tuple[str, int, dict[str, int]]:
        # Walk the pattern registry, replacing every match with the <masked>
        # placeholder before the next pattern sees the string. breakdown maps
        # pattern NAME -> hit count (never the matched value) so REDACTED log
        # lines can say *which* pattern fired without logging the secret/PII.
        total = 0
        breakdown: dict[str, int] = {}
        for name, pat in REDACT_PATTERNS:
            text, n = pat.subn("<masked>", text)
            if n:
                total += n
                breakdown[name] = breakdown.get(name, 0) + n
        return text, total, breakdown

    def _fmt_breakdown(breakdown: dict[str, int]) -> str:
        # Sorted by count desc for readability; e.g. "jwt:15,phone:57".
        return ",".join(f"{k}:{v}" for k, v in sorted(breakdown.items(), key=lambda kv: -kv[1]))

    def _truncate_for_log(text: str, max_len: int) -> str:
        # Truncated form is for human/grep consumption only — it is not valid
        # JSON and must not be parsed back out.
        if len(text) <= max_len:
            return text
        return text[:max_len] + f"...(truncated, {len(text)} bytes total)"

    def _mcp_tool_calls(flow: http.HTTPFlow) -> list[tuple[object, str, object]]:
        # Extract (id, tool, arguments) for every JSON-RPC tools/call in the
        # request body; [] for anything that isn't one. id is the JSON-RPC
        # request id, echoed back in the response — used to match this call to
        # its result/error in _mcp_tool_responses (response() below), since
        # client=ip:port alone doesn't disambiguate concurrent/keep-alive calls
        # from the same sandbox. Only the HTTP vmcp server transits this proxy
        # (mnemosyne is stdio/local), so every call here is vmcp's
        # call_tool/find_tool wrapper — call_tool is unwrapped so the REAL nested
        # tool surfaces. Fail-quiet on any parse error: logging must never break
        # the request path. Runs AFTER body redaction (request() below), so the
        # arguments returned are already <masked>-scrubbed — secrets never logged.
        if flow.request.method != "POST":
            return []
        ct = flow.request.headers.get("content-type", "").split(";")[0].strip().lower()
        if ct != "application/json":
            return []
        try:
            msg = json.loads(flow.request.get_text(strict=False))
        except Exception:
            return []
        # Accept a single JSON-RPC object or a batch (list of them).
        entries = msg if isinstance(msg, list) else [msg]
        calls: list[tuple[object, str, object]] = []
        for entry in entries:
            if not isinstance(entry, dict) or entry.get("method") != "tools/call":
                continue
            params = entry.get("params")
            if not isinstance(params, dict):
                continue
            name = params.get("name")
            args = params.get("arguments")
            if not isinstance(args, dict):
                args = {}
            call_id = entry.get("id")
            # Unwrap vmcp's call_tool wrapper to surface the real tool + its params.
            if name == "call_tool" and isinstance(args.get("tool_name"), str):
                inner = args.get("parameters")
                calls.append((call_id, args["tool_name"], inner if isinstance(inner, dict) else {}))
            else:
                calls.append((call_id, name if isinstance(name, str) else "?", args))
        return calls
    def _mcp_response_entries(flow: http.HTTPFlow) -> list[dict] | None:
        # Parse the JSON-RPC response entries (single object or batch) out of
        # flow.response, accepting either a plain application/json body or a
        # single-event text/event-stream body carrying one "data: <json>" line —
        # the streamable-HTTP transport lets agentgateway answer a tools/call
        # either way (mirrors mcp-cerbos-shim's extractJSONRPCBody,
        # images/mcp-cerbos-shim/internal/upstream/client.go, which hits this
        # SAME agentgateway vmcp route and has to handle both shapes). Chunked
        # transfer-encoding needs no special-casing here — it's a wire encoding,
        # not a content framing, and flow.response.get_text() already returns the
        # fully assembled body regardless of it (this addon never sets
        # flow.response.stream, so mitmproxy fully buffers before response()
        # fires). Returns None if unparseable/not JSON-RPC-shaped — fail-quiet,
        # logging must never break the response path.
        if not flow.response or not flow.response.content:
            return None
        ct = flow.response.headers.get("content-type", "").split(";")[0].strip().lower()
        try:
            text = flow.response.get_text(strict=False)
        except Exception:
            return None
        if ct == "application/json":
            raw = text
        elif ct == "text/event-stream":
            raw = None
            for line in text.split("\n"):
                line = line.strip()
                if line.startswith("data:"):
                    raw = line[len("data:"):].strip()
                    break
            if raw is None:
                return None
            # This body bypassed the main response()-body redaction above (which
            # skips SSE to avoid buffering issues) — it's about to be logged, so
            # it must get the same secret-scrubbing every other logged string in
            # this file gets. Only the local copy used for the log line is
            # redacted; the bytes actually forwarded to the agent are untouched.
            raw, _n, _bd = _redact(raw)
        else:
            return None
        try:
            msg = json.loads(raw)
        except Exception:
            return None
        entries = msg if isinstance(msg, list) else [msg]
        return [e for e in entries if isinstance(e, dict)]
    def _mcp_tool_responses(flow: http.HTTPFlow) -> list[tuple[object, str, bool, object]]:
        # Match each JSON-RPC tools/call in this flow's request (_mcp_tool_calls)
        # to its entry in the response by id, returning (id, tool, ok, payload) —
        # payload is the exact result (or error) object the agent receives,
        # already secret-redacted. ok is False for a JSON-RPC-level error OR an
        # MCP tool-level isError:true result, True otherwise (including the
        # non-compliant case of neither key present — fail-open, matching this
        # file's philosophy elsewhere). [] if this flow has no tools/call
        # requests or the response can't be parsed as JSON-RPC.
        #
        # Matching is a linear scan, not an id -> entry dict: a hostile/buggy
        # sandbox can send a JSON-RPC id that's a list or object (invalid per
        # spec, but json.loads won't reject it), which would raise
        # "unhashable type" if used as a dict key — logging must never break the
        # response path. Batches are tiny-to-nonexistent in practice (MCP
        # 2025-06-18, which this stack speaks, dropped JSON-RPC batching), so
        # there's no real cost to the linear scan.
        calls = _mcp_tool_calls(flow)
        if not calls:
            return []
        entries = _mcp_response_entries(flow)
        if not entries:
            return []
        results: list[tuple[object, str, bool, object]] = []
        for call_id, tool, _args in calls:
            entry = next((e for e in entries if e.get("id") == call_id), None)
            if entry is None:
                continue
            if "error" in entry:
                results.append((call_id, tool, False, entry["error"]))
            else:
                payload = entry.get("result")
                ok = not (isinstance(payload, dict) and payload.get("isError") is True)
                results.append((call_id, tool, ok, payload))
        return results
    def request(flow: http.HTTPFlow) -> None:
        host = flow.request.pretty_host
        method = flow.request.method
        url = flow.request.pretty_url
        internal = _is_internal(host)

        # SSRF protection — external destinations only.
        if not internal and _is_private(host):
            log.warning("client=%s BLOCKED private-dest method=%s url=%s", _client(flow), method, url)
            flow.response = http.Response.make(
                403,
                f"[egress-proxy] {host} is a private address — blocked",
                {"Content-Type": "text/plain"},
            )
            return

        # Block WebSocket upgrades everywhere.
        if flow.request.headers.get("upgrade", "").lower() == "websocket":
            log.warning("client=%s BLOCKED websocket-upgrade method=%s url=%s", _client(flow), method, url)
            flow.response = http.Response.make(
                403,
                "[egress-proxy] WebSocket upgrade blocked — add host to no_proxy",
                {"Content-Type": "text/plain"},
            )
            return

        # URL length limit on external requests — caps naive query-string exfiltration.
        # Legitimate API/search URLs are well under 2048 chars.
        if not internal and len(url) > MAX_URL_LENGTH:
            log.warning("client=%s BLOCKED url-too-long len=%d method=%s url=%.120s…", _client(flow), len(url), method, url)
            flow.response = http.Response.make(
                403,
                f"[egress-proxy] URL too long ({len(url)} > {MAX_URL_LENGTH})",
                {"Content-Type": "text/plain"},
            )
            return

        # Scrub secrets from request URL path + query string on every destination.
        # Headers and body are scrubbed later; the URL is the only remaining data channel
        # for GET requests (bodies blocked below), so it must also be scrubbed.
        # NOTE: scrubbing is pattern-based — encoding (base64, hex) evades it; the FQDN
        # allowlist is the primary external control, not this scrub.
        raw_path = flow.request.path
        new_path, n, bd = _redact(raw_path)
        if n:
            flow.request.path = new_path
            log.warning(
                "client=%s REDACTED-URL count=%d patterns=%s method=%s url=%s",
                _client(flow), n, _fmt_breakdown(bd), method, url,
            )

        # Block GET/HEAD request bodies on external requests — no legitimate use,
        # potential exfiltration channel. Checked before scrubbing so we avoid
        # unnecessary work and the log ordering stays semantically correct
        # (BLOCKED fires before any REDACTED line for the same flow).
        if not internal and method in ALLOWED_METHODS and flow.request.content:
            log.warning("client=%s BLOCKED get-body method=%s url=%s", _client(flow), method, url)
            flow.response = http.Response.make(
                403,
                "[egress-proxy] GET/HEAD request bodies are not permitted",
                {"Content-Type": "text/plain"},
            )
            return

        # Scrub Bearer tokens from the Authorization header on every destination.
        redacted = 0
        redact_breakdown: dict[str, int] = {}
        auth = flow.request.headers.get("authorization", "")
        m = BEARER_PATTERN.match(auth) if auth else None
        if m:
            flow.request.headers["authorization"] = m.group(1) + "<masked>"
            redacted += 1

        # Scrub additional auth header schemes on every destination.
        # Basic auth credentials and API key headers carry secrets in plaintext.
        auth = flow.request.headers.get("authorization", "")
        if auth.lower().startswith("basic "):
            flow.request.headers["authorization"] = "Basic <masked>"
            redacted += 1
        for hdr in ("x-api-key", "api-key"):
            if flow.request.headers.get(hdr):
                flow.request.headers[hdr] = "<masked>"
                redacted += 1

        # Scrub secrets from all request headers.
        for name, value in list(flow.request.headers.items()):
            if name.lower() == "authorization":
                continue  # already handled above
            new_value, n, bd = _redact(value)
            if n:
                flow.request.headers[name] = new_value
                redacted += n
                for k, v in bd.items():
                    redact_breakdown[k] = redact_breakdown.get(k, 0) + v

        # Scrub secrets from request body (text content only; skip binary).
        # Method-exemption bodies (e.g. git-upload-pack) are scrubbed too despite
        # non-text content-type — cheap defense-in-depth in case a secret ends up
        # in one (e.g. a leaked token pasted into a branch name).
        method_exemption = _matching_method_exemption(flow)
        if flow.request.content:
            ct = flow.request.headers.get("content-type", "")
            if not ct or _is_text(ct) or method_exemption:
                try:
                    body = flow.request.get_text(strict=False)
                    new_body, n, bd = _redact(body)
                    if n:
                        flow.request.set_text(new_body)
                        redacted += n
                        for k, v in bd.items():
                            redact_breakdown[k] = redact_breakdown.get(k, 0) + v
                except Exception:
                    pass
        if redacted:
            log.warning(
                "client=%s REDACTED count=%d patterns=%s method=%s url=%s",
                _client(flow), redacted, _fmt_breakdown(redact_breakdown), method, url,
            )

        # Method enforcement — external destinations only, unless a narrowly-scoped
        # exemption in METHOD_EXEMPTIONS matches (e.g. git-upload-pack for
        # smart-HTTP clone/fetch, needed for pre-commit hook installs).
        if not internal and method not in ALLOWED_METHODS and not method_exemption:
            log.warning("client=%s BLOCKED method=%s url=%s", _client(flow), method, url)
            flow.response = http.Response.make(
                403,
                f"[egress-proxy] {method} blocked — GET/HEAD only for external destinations",
                {"Content-Type": "text/plain"},
            )
            return
        if not internal:
            if not _is_allowed_fqdn(host):
                log.warning("client=%s BLOCKED fqdn-not-allowlisted method=%s url=%s", _client(flow), method, url)
                flow.response = http.Response.make(
                    403,
                    (
                        f"[egress-proxy] {host} is not on the FQDN allowlist and will be"
                        " dropped by the network policy. Use an MCP tool instead"
                        " (web_search, firecrawl, tavily, gitlab, kubernetes, etc.)."
                    ),
                    {"Content-Type": "text/plain"},
                )
                return
            if _path_scope_violation(host, flow.request.path):
                log.warning("client=%s BLOCKED path-not-in-scope method=%s url=%s", _client(flow), method, url)
                flow.response = http.Response.make(
                    403,
                    f"[egress-proxy] {host} is scoped to {EXTERNAL_PATH_SCOPES.get(host)} only",
                    {"Content-Type": "text/plain"},
                )
                return
        mcp_calls = _mcp_tool_calls(flow)
        if mcp_calls:
            for call_id, tool, args in mcp_calls:
                log.info(
                    "client=%s MCP-CALL tool=%s id=%s args=%s url=%s",
                    _client(flow), tool, call_id,
                    json.dumps(args, separators=(",", ":"), ensure_ascii=False), url,
                )
        else:
            log.info("client=%s ALLOW internal=%s method=%s url=%s", _client(flow), internal, method, url)
    def response(flow: http.HTTPFlow) -> None:
        status = flow.response.status_code if flow.response else "-"

        # Scrub secrets from response body — guards against echo attacks.
        # Skip streaming responses (SSE / chunked transfer) to avoid buffering issues.
        scrubbed = 0
        scrub_breakdown: dict[str, int] = {}
        if flow.response and flow.response.content:
            te = flow.response.headers.get("transfer-encoding", "").lower()
            ct = flow.response.headers.get("content-type", "")
            is_sse = "text/event-stream" in ct
            is_chunked = "chunked" in te
            if not is_sse and not is_chunked and _is_text(ct):
                try:
                    body = flow.response.get_text(strict=False)
                    new_body, n, bd = _redact(body)
                    if n:
                        flow.response.set_text(new_body)
                        scrubbed += n
                        for k, v in bd.items():
                            scrub_breakdown[k] = scrub_breakdown.get(k, 0) + v
                except Exception:
                    pass
        # Independent of the MCP-RESPONSE/RESPONSE summary line below — mirrors
        # how REDACTED/REDACTED-URL are independent of MCP-CALL/ALLOW in
        # request() above, so a scrubbed MCP tool response still gets its
        # correlation line instead of it being silently dropped.
        if scrubbed:
            log.warning(
                "client=%s RESPONSE-REDACTED count=%d patterns=%s method=%s status=%s url=%s",
                _client(flow),
                scrubbed,
                _fmt_breakdown(scrub_breakdown),
                flow.request.method,
                status,
                flow.request.pretty_url,
            )

        mcp_responses = _mcp_tool_responses(flow)
        if mcp_responses:
            for call_id, tool, ok, payload in mcp_responses:
                text = json.dumps(payload, separators=(",", ":"), ensure_ascii=False)
                text = _truncate_for_log(text, MAX_MCP_RESPONSE_LOG_LENGTH)
                log.info(
                    "client=%s MCP-RESPONSE tool=%s id=%s ok=%s result=%s status=%s url=%s",
                    _client(flow), tool, call_id, ok, text, status, flow.request.pretty_url,
                )
        elif not scrubbed:
            log.info(
                "client=%s RESPONSE method=%s status=%s url=%s",
                _client(flow),
                flow.request.method,
                status,
                flow.request.pretty_url,
            )
    def http_connect(flow: http.HTTPFlow) -> None:
        host = flow.request.host
        if not _is_allowed_fqdn(host):
            log.warning("client=%s BLOCKED connect-fqdn-not-allowlisted host=%s", _client(flow), host)
            flow.response = http.Response.make(
                403,
                f"[egress-proxy] {host} is not on the FQDN allowlist",
                {"Content-Type": "text/plain"},
            )
    def websocket_start(flow: http.HTTPFlow) -> None:
        # Belt-and-suspenders: kill any WS that slipped past the request hook.
        log.warning("client=%s BLOCKED websocket-start host=%s", _client(flow), flow.request.pretty_host)
        flow.kill()
