{{- if eq (include "vicegerent-egress-proxy.webhooksEnabled" .) "true" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-egress-proxy
  namespace: egress-proxy
  labels:
    app.kubernetes.io/name: webhook-egress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-egress-proxy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-egress-proxy
      annotations:
        checksum/addon: {{ include (print $.Template.BasePath "/addon-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mitmproxy
          # renovate: datasource=docker depName=mitmproxy/mitmproxy
          image: docker.io/mitmproxy/mitmproxy:12.2.3
          command: [mitmdump]
          args:
            - --listen-port=8080
            - --mode=regular
            - --set=confdir=/tmp/mitmproxy
            - --set=verbosity=info
            - --set=termlog_verbosity=error
            - --set=flow_detail=0
            - --scripts=/addon/scrub.py
          env:
            - name: WEBHOOK_PROXY_MODE
              value: enabled
            - name: PROMPT_INJECTION_DETECTION
              value: {{ .Values.policy.contentSafety.promptInjection.status | quote }}
            - name: PROMPT_INJECTION_JUDGE_MODEL
              value: {{ .Values.policy.contentSafety.promptInjection.judgeModel | quote }}
          ports:
            - containerPort: 8080
              name: proxy
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: addon
              mountPath: /addon
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: addon
          configMap:
            name: egress-proxy-addon
        - name: tmp
          emptyDir: {}
{{- end }}
