{{- if eq (include "vicegerent-webhook-listener.enabled" .) "true" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-listener
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: webhook-listener
  annotations:
    secret.reloader.stakater.com/reload: vicegerent-webhook-secrets
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-listener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-listener
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-listener
          # renovate: datasource=docker depName=harbor.hahomelabs.com/vicegerent/webhook-listener
          image: harbor.hahomelabs.com/vicegerent/webhook-listener:v0.2.7
          env:
            - name: WEBHOOK_LISTEN_ADDRESS
              value: 0.0.0.0:8081
            - name: WEBHOOK_FORWARD_PROXY
              value: http://webhook-egress-proxy.egress-proxy.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          startupProbe:
            exec:
              command: [/usr/local/bin/webhook-listener, healthcheck]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [/usr/local/bin/webhook-listener, healthcheck]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [/usr/local/bin/webhook-listener, healthcheck]
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vicegerent-webhooks
              readOnly: true
            - name: route-secrets
              mountPath: /var/run/secrets/vicegerent-webhooks
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: webhook-listener
        - name: route-secrets
          secret:
            defaultMode: 0400
            secretName: vicegerent-webhook-secrets # pragma: allowlist secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cloudflared
  annotations:
    secret.reloader.stakater.com/reload: vicegerent-cloudflared-credentials
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
      annotations:
        checksum/cloudflared: {{ include (print $.Template.BasePath "/configmap-cloudflared.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # renovate: datasource=docker depName=cloudflare/cloudflared
          image: docker.io/cloudflare/cloudflared:2026.7.3
          args: [tunnel, --config, /etc/cloudflared/config/config.yaml, run]
          env:
            # Loopback-only metrics endpoint. It stays an env var because the
            # probes run `cloudflared tunnel ready` without --config, so they
            # cannot read the address from the tunnel ConfigMap.
            - name: TUNNEL_METRICS
              value: 127.0.0.1:2000
          startupProbe:
            exec:
              command: [cloudflared, tunnel, ready]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [cloudflared, tunnel, ready]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [cloudflared, tunnel, ready]
            periodSeconds: 30
            # Tolerate a transient Cloudflare edge outage before restarting.
            failureThreshold: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: cloudflared-config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: cloudflared-credentials
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: cloudflared-config
          configMap:
            name: cloudflared
        - name: cloudflared-credentials
          secret:
            defaultMode: 0400
            secretName: vicegerent-cloudflared-credentials # pragma: allowlist secret
{{- end }}
