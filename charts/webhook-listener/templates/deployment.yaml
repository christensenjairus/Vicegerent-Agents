{{- if eq (include "vicegerent-webhook-listener.enabled" .) "true" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-listener
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: webhook-listener
  annotations:
    secret.reloader.stakater.com/reload: vicegerent-ngrok-authtoken,vicegerent-webhook-secrets
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-listener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-listener
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-listener
          # renovate: datasource=docker depName=harbor.hahomelabs.com/vicegerent/webhook-listener
          image: harbor.hahomelabs.com/vicegerent/webhook-listener:v0.1.6
          env:
            - name: NGROK_AUTHTOKEN
              valueFrom:
                secretKeyRef:
                  name: vicegerent-ngrok-authtoken
                  key: authtoken
            - name: WEBHOOK_PUBLIC_URL
              value: {{ .Values.webhooks.publicUrl | quote }}
            - name: WEBHOOK_FORWARD_PROXY
              value: http://webhook-egress-proxy.egress-proxy.svc.cluster.local:8080
          startupProbe:
            exec:
              command: [/usr/local/bin/webhook-listener, healthcheck]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [/usr/local/bin/webhook-listener, healthcheck]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [/usr/local/bin/webhook-listener, healthcheck]
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vicegerent-webhooks
              readOnly: true
            - name: route-secrets
              mountPath: /var/run/secrets/vicegerent-webhooks
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: webhook-listener
        - name: route-secrets
          secret:
            defaultMode: 0400
            secretName: vicegerent-webhook-secrets # pragma: allowlist secret
{{- end }}
