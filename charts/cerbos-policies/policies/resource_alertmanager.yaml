---
# alertmanager_silence policy: deny createSilence calls whose duration exceeds
# this machine's cap (${alertmanagerMaxSilenceSeconds}, from
# policy.alertmanager -- a non-positive cap disables creation, work is capped at
# 24h, and personal at 14d). The
# shim's alertmanagerAttr helper (helpers_alertmanager.go) converts
# createSilence's free-form `duration` string ("30m","2h","1d") into
# durationSeconds, defaulting an omitted duration to Alertmanager's own
# documented 2h rather than bypassing the cap.
#
# getSilences and other read tools are unmapped and pass; getAlerts is
# mapped to the alertmanager_alert_query resource instead (see
# resource_alertmanager_alert_query.yaml), which requires a filterLabel.
#
# deny-not-own-silence: mapping.yaml forces every created silence's createdBy
# to this machine's fixed ${alertmanagerCreatedBy} identity
# (Alertmanager's own createdBy is caller-supplied and optional, unlike
# GitHub/Notion's externally-authenticated author fields, so establishing a
# real identity to check requires stamping one at creation time first), and
# deleteSilence has the shim resolve the target silence's createdBy via
# a live getSilences lookup BEFORE Cerbos is consulted (server.go's
# checkAlertmanagerSilenceOwner -- a network round trip Cerbos itself can't
# make), injecting it as this createdBy attr. has()-guarded to match
# deny-not-own-pr's posture, though in practice the shim's lookup gate fails
# closed before Cerbos on any unresolvable createdBy, so this rule should
# never see it absent. An unset ${alertmanagerCreatedBy} denies every
# delete outright -- with no identity there is nothing to verify against, and a
# bare `createdBy != ""` would only fail closed by accident.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: alertmanager_silence
  rules:
    - name: deny-silence-too-long
      actions: [create]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            {{ .Values.policy.alertmanager.maxSilenceSeconds | int }} <= 0 ||
            (has(request.resource.attr.durationSeconds) &&
            int(request.resource.attr.durationSeconds) > {{ .Values.policy.alertmanager.maxSilenceSeconds | int }})
      output:
        when:
          ruleActivated: >-
            "Silence creation is disabled or its duration exceeds this agent's"
            + " cap of {{ .Values.policy.alertmanager.maxSilenceSeconds | int }} seconds."
            + " Create a shorter silence, or ask a human to extend it."
    - name: deny-not-own-silence
      actions: [delete]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            {{ .Values.policy.alertmanager.createdBy | quote }} == "" ||
            (has(request.resource.attr.createdBy) && request.resource.attr.createdBy
            != {{ .Values.policy.alertmanager.createdBy | quote }})
      output:
        when:
          ruleActivated: >-
            "This agent may only delete silences it created itself. This"
            + " silence was not created by the configured identity; the"
            + " target silence id may be wrong."
    - name: allow-all
      actions: ['*']
      effect: EFFECT_ALLOW
      roles: ['*']
