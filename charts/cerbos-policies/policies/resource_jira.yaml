---
# jira_project policy: reads (jira_get_issue/get_project_issues/get_transitions)
# are allowed against ANY project; only writes (create/update/transition/
# comment/link) are denied when they target a project outside the allowed
# list (policy.workManagement.jira.allowedProjects), or
# assign an issue to someone outside ${jiraAllowedAssignees} -- mirrors
# Notion's read-everywhere/write-scoped model and Linear's teamId allowlist
# pattern (note there is no `reporter` field on this Jira tool at all, only
# `assignee` -- confirmed against docs/available-mcp-tools/jira.yaml's real
# schema, so reporter scoping is out of scope here, not deferred). The
# shim maps every project/issue-bearing Jira tool to this resource, carrying
# project_key plus any issue/inward/outward/epic keys (whose "<PROJECT>-123"
# prefix is the project), PLUS extraEpicKey/extraParentKey/assignee -- values
# the jiraFieldsAttr helper (helpers_jira.go) parsed out of create_issue's
# top-level assignee arg and out of create_issue's/update_issue's raw
# additional_fields/fields JSON string args (additional_fields can smuggle
# {"epicKey": "OTHER-123"} bypassing the plain top-level epic_key check
# entirely -- a documented control being
# routed around via a side channel, not just an unmapped extra arg). A write
# is denied if any populated project-scoping key's project isn't in the
# allowlist -- checked via .exists() over ${jiraAllowedProjects} matching
# either an exact projectKey or an issue/inward/outward/epic/extraEpic/
# extraParent key's "-123" prefix, the same any-element pattern as the
# GitHub/Linear allowlists just applied per-key instead of to a single
# scalar -- OR if assignee is set to anyone outside ${jiraAllowedAssignees}
# (a wildcard "*" entry in that list disables the assignee check entirely).
#
# deny-create-missing-assignee: every new issue must set an assignee, not just
# avoid a disallowed one.
# create_issue is distinguished from every other jira_* tool mapped here by
# shape, not a dedicated attr: it's the only one that supplies project_key
# without an issue_key (update/transition/comment/link/link_to_epic all take
# issue_key, never project_key) -- so `projectKey != "" && issueKey == ""`
# reliably identifies a create call using attrs already on this resource,
# with no mapping.yaml/helper change needed. Updates that don't touch
# assignee at all are untouched by this rule (issueKey is set, so the
# create-shape condition never matches) -- reassigning an EXISTING issue
# away from ${jiraAllowedAssignees} is caught by
# deny-assignee-outside-allowed below. The "*" bypass is
# honored here too, matching the disable-the-whole-check semantics.
# deny-issue-type-outside-allowed: create/update calls that set
# issueType (create's top-level issue_type arg, or an 'issuetype'/'issueType'
# key smuggled into update's fields/additional_fields JSON -- update has no
# top-level issue_type arg at all) to anything outside
# ${jiraAllowedIssueTypes} are denied -- project scoping alone doesn't stop
# an agent from creating/reshaping a project's planning hierarchy with an
# Epic/Subtask it shouldn't. Mirrors the assignee allowlist's "*" bypass
# semantics exactly: "*" disables the check entirely.
#
# deny-write-unassigned-issue covers the empty-assignee case that
# deny-assignee-outside-allowed cannot match because it only fires when
# attr.assignee is non-empty, so an update_issue/add_comment/transition_issue
# against a genuinely UNASSIGNED issue left the assignee attr empty and fell
# through to allow-all, since there is no non-empty value to compare.
# server.go's ticket-assignee resolution gate sets an assigneeVerified=true marker whenever it runs the live lookup
# and gets a definitive answer (including "no assignee") -- this rule denies
# specifically when that marker is true and the resolved assignee still came
# back empty. Scoped to actions:[write] like every other rule here; the "*"
# bypass is honored too, matching the disable-the-whole-check semantics.
# create_issue is unaffected (this gate never runs for it -- jiraAssigneeGatedTools
# only covers update/comment/transition on an EXISTING issue; create's own
# missing-assignee case is deny-create-missing-assignee's job).
#
# deny-existing-assignee-outside-allowed vs deny-assignee-outside-allowed:
# both deny a write whose assignee is outside ${jiraAllowedAssignees}, but
# they are two rules so the denial message can be accurate about WHY. The
# assigneeVerified marker (above) distinguishes the two situations: when it is
# set, attr.assignee is the issue's CURRENT assignee resolved by the live
# lookup and the call itself asked for no assignee change (e.g. an add_comment
# carrying only issue_key+comment) -- the message says the issue is already
# assigned to someone out of scope; when it is unset, attr.assignee is a value
# the call ITSELF supplied (a deliberate (re)assignment) -- the message says
# the requested assignee is out of scope. deny-assignee-outside-allowed
# therefore excludes the assigneeVerified==true case (owned by
# deny-existing-assignee-outside-allowed); the two are mutually exclusive on
# that marker, so exactly one fires and surfaces the right message.
#
# Do NOT add tools here to permit them; that belongs in the vMCP tools
# allowlist.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: jira_project
  rules:
    - name: deny-write-outside-allowed-projects
      actions: [write]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            !([{{ include "cerbos-policies.celList" .Values.policy.workManagement.jira.allowedProjects }}].exists(p,
            (!has(request.resource.attr.projectKey) || request.resource.attr.projectKey
            == "" || request.resource.attr.projectKey == p)
            && (!has(request.resource.attr.issueKey) || request.resource.attr.issueKey
            == "" || request.resource.attr.issueKey.startsWith(p + "-"))
            && (!has(request.resource.attr.inwardKey) || request.resource.attr.inwardKey
            == "" || request.resource.attr.inwardKey.startsWith(p + "-"))
            && (!has(request.resource.attr.outwardKey) || request.resource.attr.outwardKey
            == "" || request.resource.attr.outwardKey.startsWith(p + "-"))
            && (!has(request.resource.attr.epicKey) || request.resource.attr.epicKey
            == "" || request.resource.attr.epicKey.startsWith(p + "-"))
            && (!has(request.resource.attr.extraEpicKey) || request.resource.attr.extraEpicKey
            == "" || request.resource.attr.extraEpicKey.startsWith(p + "-"))
            && (!has(request.resource.attr.extraParentKey) || request.resource.attr.extraParentKey
            == "" || request.resource.attr.extraParentKey.startsWith(p + "-"))
            ))
      output:
        when:
          ruleActivated: >-
            "This agent may only create/update Jira issues in its allowed"
            + " projects. The targeted project/issue/epic is outside that scope."
    - name: deny-create-missing-assignee
      actions: [write]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            request.resource.attr.projectKey != "" &&
            request.resource.attr.issueKey == "" &&
            (!has(request.resource.attr.assignee) || request.resource.attr.assignee
            == "")
            && !("*" in [{{ include "cerbos-policies.celList" .Values.policy.workManagement.jira.allowedAssignees }}])
      output:
        when:
          ruleActivated: >-
            "This agent must set an allowed assignee when creating a new"
            + " Jira issue. Pass assignee explicitly."
    - name: deny-assignee-outside-allowed
      actions: [write]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            has(request.resource.attr.assignee) && request.resource.attr.assignee
            != ""
            && !(has(request.resource.attr.assigneeVerified) && request.resource.attr.assigneeVerified == true)
            && !("*" in [{{ include "cerbos-policies.celList" .Values.policy.workManagement.jira.allowedAssignees }}])
            && !(request.resource.attr.assignee in [{{ include "cerbos-policies.celList" .Values.policy.workManagement.jira.allowedAssignees }}])
      output:
        when:
          ruleActivated: >-
            "This agent may only assign Jira issues to an allowed user."
            + " The requested assignee is outside that scope."
    - name: deny-existing-assignee-outside-allowed
      actions: [write]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            has(request.resource.attr.assigneeVerified) &&
            request.resource.attr.assigneeVerified == true &&
            has(request.resource.attr.assignee) && request.resource.attr.assignee
            != ""
            && !("*" in [{{ include "cerbos-policies.celList" .Values.policy.workManagement.jira.allowedAssignees }}])
            && !(request.resource.attr.assignee in [{{ include "cerbos-policies.celList" .Values.policy.workManagement.jira.allowedAssignees }}])
      output:
        when:
          ruleActivated: >-
            "This agent may only update/comment/transition Jira issues assigned"
            + " to an allowed user. This issue is currently assigned to someone"
            + " outside that scope -- reassign it to an allowed user first."
    - name: deny-issue-type-outside-allowed
      actions: [write]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            has(request.resource.attr.issueType) && request.resource.attr.issueType
            != ""
            && !("*" in [{{ include "cerbos-policies.celList" .Values.policy.workManagement.jira.allowedIssueTypes }}])
            && !(request.resource.attr.issueType in [{{ include "cerbos-policies.celList" .Values.policy.workManagement.jira.allowedIssueTypes }}])
      output:
        when:
          ruleActivated: >-
            "This agent may only create/update Jira issues of an allowed"
            + " issue type. The requested issue type is outside that scope."
    - name: deny-write-unassigned-issue
      actions: [write]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            has(request.resource.attr.assigneeVerified) &&
            request.resource.attr.assigneeVerified == true &&
            (!has(request.resource.attr.assignee) || request.resource.attr.assignee
            == "")
            && !("*" in [{{ include "cerbos-policies.celList" .Values.policy.workManagement.jira.allowedAssignees }}])
      output:
        when:
          ruleActivated: >-
            "This agent may only update/comment/transition a Jira issue that"
            + " has an assignee. This issue currently has no assignee --"
            + " assign it to an allowed user first."
    - name: allow-all
      actions: ['*']
      effect: EFFECT_ALLOW
      roles: ['*']
