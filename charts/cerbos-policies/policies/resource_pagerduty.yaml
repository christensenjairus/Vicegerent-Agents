---
# pagerduty_incident policy: allow reads and notes, but restrict incident
# management to status changes that acknowledge or resolve incidents. The
# pagerdutyManageAttr helper accepts only incident_ids and status in the tool's
# flat manage_request object; any other key sets hasOutOfScopeChange. A single
# check covers every incident in a bulk request.
#
# The shim resolves each target incident's service before consulting Cerbos and
# supplies the resulting serviceIds. A write is denied when any service is
# outside ${pagerdutyAllowedServiceIds}; "*" disables service scoping. The
# entire bulk request is denied if one incident is out of scope.
#
# create_incident, add_responders, and start_incident_workflow are excluded by
# the ToolHive allowlist rather than handled here. Other read-only tools are
# unmapped and pass through this policy.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: pagerduty_incident
  rules:
    - name: deny-non-ack-resolve-change
      actions: [manage]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            has(request.resource.attr.hasOutOfScopeChange) &&
            request.resource.attr.hasOutOfScopeChange == "true"
      output:
        when:
          ruleActivated: >-
            "This agent may only acknowledge or resolve PagerDuty incidents."
            + " Reopening to 'triggered', and urgency/escalation/assignment"
            + " changes, are not allowed."
    - name: deny-write-outside-allowed-services
      actions: [manage, annotate]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            has(request.resource.attr.serviceIds) &&
            !("*" in [{{ include "cerbos-policies.celList" .Values.policy.workManagement.pagerduty.allowedServiceIds }}]) &&
            request.resource.attr.serviceIds.exists(s, !(s in [{{ include "cerbos-policies.celList" .Values.policy.workManagement.pagerduty.allowedServiceIds }}]))
      output:
        when:
          ruleActivated: >-
            "This agent may only act on PagerDuty incidents belonging to an"
            + " allowed service. At least one targeted incident is outside"
            + " that scope."
    - name: allow-all
      actions: ['*']
      effect: EFFECT_ALLOW
      roles: ['*']
