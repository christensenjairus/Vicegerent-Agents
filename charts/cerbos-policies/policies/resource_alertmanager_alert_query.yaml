---
# alertmanager_alert_query policy: require getAlerts to include a non-empty
# filterLabel. Unfiltered calls return every active alert as unaggregated JSON
# and exceed the tool-call timeout; filtered calls complete promptly. Any
# non-empty filter is accepted, including severity, alert name, or namespace.
# Other Alertmanager read tools are not mapped to this resource.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: alertmanager_alert_query
  rules:
    - name: deny-getAlerts-missing-filter
      actions: [read]
      effect: EFFECT_DENY
      roles: ['*']
      condition:
        match:
          expr: >-
            !has(request.resource.attr.filterLabel) ||
            request.resource.attr.filterLabel == ""
      output:
        when:
          ruleActivated: >-
            "getAlerts requires filterLabel to be set -- calling it with no"
            + " filter returns every active alert and will"
            + " time out. This agent only cares about critical alerts (that's"
            + " all it gets paged for), so use getCriticalAlerts, or pass"
            + " filterLabel (e.g. 'severity=critical', or a specific"
            + " alertname/namespace) to getAlerts directly."
    - name: allow-all
      actions: ['*']
      effect: EFFECT_ALLOW
      roles: ['*']
