---
name: k8s_secret_block_test
description: Secrets are denied for every tool; non-secret reads are allowed.
options:
  now: '2026-06-25T00:00:00Z'
principals:
  agent:
    id: agent
    roles: [agent]
resources:
  secret_in_kube_system:
    id: secret_in_kube_system
    kind: k8s_resource
    attr:
      kind: Secret
      apiResource: secrets
  secret_via_list:
    id: secret_via_list
    kind: k8s_resource
    attr:
      apiResource: secrets
  pod_in_default:
    id: pod_in_default
    kind: k8s_resource
    attr:
      kind: Pod
      apiResource: pods
  configmap_in_default:
    id: configmap_in_default
    kind: k8s_resource
    attr:
      kind: ConfigMap
      apiResource: configmaps
  crd_in_default:
    id: crd_in_default
    kind: k8s_resource
    attr:
      kind: PrometheusRule
      apiResource: prometheusrules
  no_kind:
    id: '*'
    kind: k8s_resource
    attr:
      kind: ''
      apiResource: ''
tests:
  - name: getResource on a Secret is denied
    input:
      principals: [agent]
      resources: [secret_in_kube_system]
      actions: [getResource, describeResource]
    expected:
      - principal: agent
        resource: secret_in_kube_system
        actions:
          getResource: EFFECT_DENY
          describeResource: EFFECT_DENY
  - name: listResources of secrets is denied
    input:
      principals: [agent]
      resources: [secret_via_list]
      actions: [listResources]
    expected:
      - principal: agent
        resource: secret_via_list
        actions:
          listResources: EFFECT_DENY
  - name: reads on non-secret kinds are allowed
    input:
      principals: [agent]
      resources: [pod_in_default, configmap_in_default]
      actions: [getResource, listResources, getPodsLogs]
    expected:
      - principal: agent
        resource: pod_in_default
        actions:
          getResource: EFFECT_ALLOW
          listResources: EFFECT_ALLOW
          getPodsLogs: EFFECT_ALLOW
      - principal: agent
        resource: configmap_in_default
        actions:
          getResource: EFFECT_ALLOW
          listResources: EFFECT_ALLOW
          getPodsLogs: EFFECT_ALLOW
  - name: arbitrary non-secret kind and tool are allowed (no per-kind allowlist)
    input:
      principals: [agent]
      resources: [crd_in_default]
      actions:
        - getResource
        - listResources
        - describeResource
        - getEvents
        - getNodeMetrics
        - getPodMetrics
    expected:
      - principal: agent
        resource: crd_in_default
        actions:
          getResource: EFFECT_ALLOW
          listResources: EFFECT_ALLOW
          describeResource: EFFECT_ALLOW
          getEvents: EFFECT_ALLOW
          getNodeMetrics: EFFECT_ALLOW
          getPodMetrics: EFFECT_ALLOW
  - name: a kind-bearing call with no resolvable kind is denied (fail closed)
    input:
      principals: [agent]
      resources: [no_kind]
      actions: [getResource, listResources, describeResource]
    expected:
      - principal: agent
        resource: no_kind
        actions:
          getResource: EFFECT_DENY
          listResources: EFFECT_DENY
          describeResource: EFFECT_DENY
