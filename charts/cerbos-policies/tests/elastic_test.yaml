---
# Fixtures use the literal denied tokens matching test-values.yaml's
# elasticDeniedIndexPatterns ("snowflake", "Salesforce") - validate.sh compiles
# the rendered policy against them, so keep the two in sync.
name: elastic_denied_index_block_test
description: Data-access calls targeting a denied index/datastream token are denied
  (by name, rollover backing index, ES|QL query text, or a mixed-case pattern); other
  data is allowed.
options:
  now: '2026-07-02T00:00:00Z'
principals:
  agent:
    id: agent
    roles: [agent]
resources:
  denied_datastream:
    id: logs-snowflake-alpha-default
    kind: elastic
    attr:
      targets: [logs-snowflake-alpha-default]
  denied_rollover_index:
    id: '*'
    kind: elastic
    attr:
      targets:
        - partial-restored-.ds-logs-snowflake-alpha-default-2024.01.01-000001
  denied_via_esql:
    id: '*'
    kind: elastic
    attr:
      targets: [from logs-snowflake-beta-default | limit 10]
  # test-values.yaml's second token is mixed-case ("Salesforce") while the
  # helper lowercases every target, so this fixture fails if the policy stops
  # lowercasing the operator's patterns at match time.
  denied_mixed_case_pattern:
    id: logs-salesforce-default
    kind: elastic
    attr:
      targets: [logs-salesforce-default]
  allowed_index:
    id: logs-nginx
    kind: elastic
    attr:
      targets: [logs-nginx]
  no_target:
    id: '*'
    kind: elastic
    attr: {}
tests:
  - name: targeting the denied datastream / its backing index / via ES|QL is denied
    input:
      principals: [agent]
      resources:
        - denied_datastream
        - denied_rollover_index
        - denied_via_esql
        - denied_mixed_case_pattern
      actions:
        - platform_core_search
        - platform_core_execute_esql
        - platform_streams_query_documents
    expected:
      - principal: agent
        resource: denied_datastream
        actions:
          platform_core_search: EFFECT_DENY
          platform_core_execute_esql: EFFECT_DENY
          platform_streams_query_documents: EFFECT_DENY
      - principal: agent
        resource: denied_rollover_index
        actions:
          platform_core_search: EFFECT_DENY
          platform_core_execute_esql: EFFECT_DENY
          platform_streams_query_documents: EFFECT_DENY
      - principal: agent
        resource: denied_via_esql
        actions:
          platform_core_search: EFFECT_DENY
          platform_core_execute_esql: EFFECT_DENY
          platform_streams_query_documents: EFFECT_DENY
      - principal: agent
        resource: denied_mixed_case_pattern
        actions:
          platform_core_search: EFFECT_DENY
          platform_core_execute_esql: EFFECT_DENY
          platform_streams_query_documents: EFFECT_DENY
  - name: a non-denied index and a call with no target arg are allowed
    input:
      principals: [agent]
      resources: [allowed_index, no_target]
      actions: [platform_core_search]
    expected:
      - principal: agent
        resource: allowed_index
        actions:
          platform_core_search: EFFECT_ALLOW
      - principal: agent
        resource: no_target
        actions:
          platform_core_search: EFFECT_ALLOW
