---
# Fixtures use durationSeconds values straddling the cap (86400s/24h) -
# validate.sh compiles against test-values.yaml's alertmanagerMaxSilenceSeconds,
# so the "exceeds cap" fixtures are what actually get exercised in CI. createdBy
# fixtures use "jchristensen", test-values.yaml's ${alertmanagerCreatedBy} value,
# for the same reason.
name: alertmanager_silence_guardrails_test
description: createSilence calls whose duration exceeds the cap are denied; calls
  within the cap are allowed. deleteSilence is denied unless the target silence's
  real createdBy (injected by the shim's live getSilences lookup, see server.go's
  checkAlertmanagerSilenceOwner) matches this machine's ${alertmanagerCreatedBy};
  a silence with no createdBy attr at all falls through to allow (has()-guard).
options:
  now: '2026-07-05T00:00:00Z'
principals:
  agent:
    id: agent
    roles: [agent]
resources:
  short_silence:
    id: HighMemoryUsage
    kind: alertmanager_silence
    attr: {durationSeconds: '3600'}  # 1h, well under either cap
  at_work_cap_silence:
    id: HighMemoryUsage
    kind: alertmanager_silence
    attr: {durationSeconds: '86400'}  # exactly the work cap; not > cap, so allowed
  over_work_cap_silence:
    id: HighMemoryUsage
    kind: alertmanager_silence
    attr: {durationSeconds: '172800'}  # 48h, exceeds the work 24h cap
  own_silence_to_delete:
    id: 6f9d3a2e-1234-4567-8901-abcdef012345
    kind: alertmanager_silence
    attr: {createdBy: jchristensen}
  other_silence_to_delete:
    id: 7a0e4b3f-2345-5678-9012-bcdef0123456
    kind: alertmanager_silence
    attr: {createdBy: someone-else}
  no_attr_silence_to_delete:
    id: 8b1f5c40-3456-6789-0123-cdef01234567
    kind: alertmanager_silence
tests:
  - name: createSilence within or at the cap is allowed
    input:
      principals: [agent]
      resources: [short_silence, at_work_cap_silence]
      actions: [create]
    expected:
      - principal: agent
        resource: short_silence
        actions: {create: EFFECT_ALLOW}
      - principal: agent
        resource: at_work_cap_silence
        actions: {create: EFFECT_ALLOW}
  - name: createSilence exceeding the cap is denied
    input:
      principals: [agent]
      resources: [over_work_cap_silence]
      actions: [create]
    expected:
      - principal: agent
        resource: over_work_cap_silence
        actions: {create: EFFECT_DENY}
  - name: deleteSilence on a silence this machine created is allowed
    input:
      principals: [agent]
      resources: [own_silence_to_delete]
      actions: [delete]
    expected:
      - principal: agent
        resource: own_silence_to_delete
        actions: {delete: EFFECT_ALLOW}
  - name: deleteSilence on a silence created by someone else is denied
    input:
      principals: [agent]
      resources: [other_silence_to_delete]
      actions: [delete]
    expected:
      - principal: agent
        resource: other_silence_to_delete
        actions: {delete: EFFECT_DENY}
  - name: deleteSilence on a silence with no createdBy attr falls through to allow
      (has()-guard)
    input:
      principals: [agent]
      resources: [no_attr_silence_to_delete]
      actions: [delete]
    expected:
      - principal: agent
        resource: no_attr_silence_to_delete
        actions: {delete: EFFECT_ALLOW}
