---
# Fixtures use the literal project matching test-values.yaml's jiraAllowedProjects --
# validate.sh compiles the rendered policy against them, so keep the two in sync.
name: jira_write_project_allowlist_test
description: Jira reads are allowed against any project; Jira writes targeting a project
  other than the allowed list (by project_key, issue/inward/outward/epic key prefix,
  or an epicKey/parent smuggled inside additional_fields/fields JSON) are denied,
  while writes confined to an allowed project are allowed. Writes setting a disallowed
  issue type (top-level on create, or smuggled into update's fields/additional_fields
  JSON) are denied. A write whose assignee was live-resolved (assigneeVerified=true)
  and came back genuinely unassigned is denied.
options:
  now: '2026-07-02T00:00:00Z'
principals:
  hermes:
    id: hermes
    roles: [agent]
resources:
  create_in_change:
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: jchristensen@moveworks.ai
      issueType: ''
  create_in_other:
    id: FOO
    kind: jira_project
    attr:
      projectKey: FOO
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      issueType: ''
  get_change_issue:
    id: CHANGE-123
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: CHANGE-123
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      issueType: ''
  get_other_issue:
    id: FOO-9
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: FOO-9
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      issueType: ''
  link_mixed_projects:
    id: CHANGE-1
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: ''
      inwardKey: CHANGE-1
      outwardKey: FOO-2
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      issueType: ''
  link_to_change_epic:
    id: CHANGE-1
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: CHANGE-1
      inwardKey: ''
      outwardKey: ''
      epicKey: CHANGE-9
      extraEpicKey: ''
      extraParentKey: ''
      issueType: ''
  link_to_other_epic:
    id: CHANGE-1
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: CHANGE-1
      inwardKey: ''
      outwardKey: ''
      epicKey: FOO-9
      extraEpicKey: ''
      extraParentKey: ''
      issueType: ''
  no_keys:
    id: '*'
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      issueType: ''
  create_change_but_smuggled_epic:
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: FOO-9
      extraParentKey: ''
      issueType: ''
  create_change_but_smuggled_parent:
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: FOO-2
      issueType: ''
  create_change_with_allowed_smuggled_epic:
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: CHANGE-9
      extraParentKey: ''
      assignee: jchristensen@moveworks.ai
      issueType: ''
  create_with_disallowed_assignee:
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: someone@example.com
      issueType: ''
  create_with_allowed_assignee:
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: jchristensen@moveworks.ai
      issueType: ''
  create_with_no_assignee:
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: ''
      issueType: ''
  update_with_no_assignee:
    id: CHANGE-1
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: CHANGE-1
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: ''
      issueType: ''
  update_verified_unassigned:
    id: CHANGE-2
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: CHANGE-2
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: ''
      assigneeVerified: true
      issueType: ''
  update_verified_with_allowed_assignee:
    id: CHANGE-2
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: CHANGE-2
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: jchristensen@moveworks.ai
      assigneeVerified: true
      issueType: ''
  # A live-resolved current assignee that's out of scope on a call that asks
  # for no assignee change is owned by deny-existing-assignee-outside-allowed.
  update_verified_disallowed_assignee:
    id: CHANGE-3
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: CHANGE-3
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: someone@example.com
      assigneeVerified: true
      issueType: ''
  create_with_allowed_issue_type:
    # Deploy Service Specific, Service Restart, and Environment Change are the
    # configured issue types; Task, Bug, and Story are outside the allowlist.
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: jchristensen@moveworks.ai
      issueType: Deploy Service Specific
  create_with_allowed_ops_issue_type:
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: jchristensen@moveworks.ai
      issueType: Environment Change
  create_with_disallowed_task_issue_type:
    # Task is outside jiraAllowedIssueTypes.
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: jchristensen@moveworks.ai
      issueType: Task
  create_with_disallowed_issue_type:
    id: CHANGE
    kind: jira_project
    attr:
      projectKey: CHANGE
      issueKey: ''
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: jchristensen@moveworks.ai
      issueType: Epic
  update_with_no_issue_type:
    id: CHANGE-1
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: CHANGE-1
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: ''
      issueType: ''
  update_with_smuggled_disallowed_issue_type:
    id: CHANGE-1
    kind: jira_project
    attr:
      projectKey: ''
      issueKey: CHANGE-1
      inwardKey: ''
      outwardKey: ''
      epicKey: ''
      extraEpicKey: ''
      extraParentKey: ''
      assignee: ''
      issueType: Subtask
tests:
  - name: reads against any project are always allowed, regardless of allowlist
    input:
      principals: [hermes]
      resources:
        - create_in_change
        - create_in_other
        - get_change_issue
        - get_other_issue
        - link_mixed_projects
        - link_to_other_epic
        - no_keys
      actions: [read]
    expected:
      - principal: hermes
        resource: create_in_change
        actions: {read: EFFECT_ALLOW}
      - principal: hermes
        resource: create_in_other
        actions: {read: EFFECT_ALLOW}
      - principal: hermes
        resource: get_change_issue
        actions: {read: EFFECT_ALLOW}
      - principal: hermes
        resource: get_other_issue
        actions: {read: EFFECT_ALLOW}
      - principal: hermes
        resource: link_mixed_projects
        actions: {read: EFFECT_ALLOW}
      - principal: hermes
        resource: link_to_other_epic
        actions: {read: EFFECT_ALLOW}
      - principal: hermes
        resource: no_keys
        actions: {read: EFFECT_ALLOW}
  - name: writes confined to an allowed project are allowed
    input:
      principals: [hermes]
      resources:
        - create_in_change
        - get_change_issue
        - link_to_change_epic
        - no_keys
        - create_change_with_allowed_smuggled_epic
      actions: [write]
    expected:
      - principal: hermes
        resource: create_in_change
        actions: {write: EFFECT_ALLOW}
      - principal: hermes
        resource: get_change_issue
        actions: {write: EFFECT_ALLOW}
      - principal: hermes
        resource: link_to_change_epic
        actions: {write: EFFECT_ALLOW}
      - principal: hermes
        resource: no_keys
        actions: {write: EFFECT_ALLOW}
      - principal: hermes
        resource: create_change_with_allowed_smuggled_epic
        actions: {write: EFFECT_ALLOW}
  - name: writes targeting another project are denied
    input:
      principals: [hermes]
      resources:
        - create_in_other
        - get_other_issue
        - link_mixed_projects
        - link_to_other_epic
        - create_change_but_smuggled_epic
        - create_change_but_smuggled_parent
      actions: [write]
    expected:
      - principal: hermes
        resource: create_in_other
        actions: {write: EFFECT_DENY}
      - principal: hermes
        resource: get_other_issue
        actions: {write: EFFECT_DENY}
      - principal: hermes
        resource: link_mixed_projects
        actions: {write: EFFECT_DENY}
      - principal: hermes
        resource: link_to_other_epic
        actions: {write: EFFECT_DENY}
      - principal: hermes
        resource: create_change_but_smuggled_epic
        actions: {write: EFFECT_DENY}
      - principal: hermes
        resource: create_change_but_smuggled_parent
        actions: {write: EFFECT_DENY}
  - name: assignee scoping (jiraAllowedAssignees is jchristensen@moveworks.ai, matching
      test-values.yaml) denies any other assignee, allows the configured one, requires
      an assignee on create (force-self-assignee), but doesn't require one on an ordinary
      update that doesn't touch assignee
    input:
      principals: [hermes]
      resources:
        - create_with_disallowed_assignee
        - create_with_allowed_assignee
        - create_with_no_assignee
        - update_with_no_assignee
      actions: [write]
    expected:
      - principal: hermes
        resource: create_with_disallowed_assignee
        actions: {write: EFFECT_DENY}
      - principal: hermes
        resource: create_with_allowed_assignee
        actions: {write: EFFECT_ALLOW}
      - principal: hermes
        resource: create_with_no_assignee
        actions: {write: EFFECT_DENY}
      - principal: hermes
        resource: update_with_no_assignee
        actions: {write: EFFECT_ALLOW}
  - name: a live-verified unassigned issue (assigneeVerified=true, assignee empty
      -- the shim's ticket-assignee resolution gate actually ran and confirmed no
      current assignee) is denied on write, unlike the unverified update_with_no_assignee
      case above where the gate never ran at all; a verified issue with an allowed
      assignee is unaffected
    input:
      principals: [hermes]
      resources:
        - update_verified_unassigned
        - update_verified_with_allowed_assignee
      actions: [write]
    expected:
      - principal: hermes
        resource: update_verified_unassigned
        actions: {write: EFFECT_DENY}
      - principal: hermes
        resource: update_verified_with_allowed_assignee
        actions: {write: EFFECT_ALLOW}
  - name: assignee-scope denials carry situation-accurate messages -- an explicitly
      requested out-of-scope assignee (create_with_disallowed_assignee, no assigneeVerified)
      says "the requested assignee is outside that scope", while a live-resolved out-of-scope
      CURRENT assignee (assigneeVerified=true, e.g. a comment on someone else's issue)
      says the issue is already assigned outside that scope
    input:
      principals: [hermes]
      resources:
        - create_with_disallowed_assignee
        - update_verified_disallowed_assignee
      actions: [write]
    expected:
      - principal: hermes
        resource: create_with_disallowed_assignee
        actions: {write: EFFECT_DENY}
        outputs:
          - action: write
            expected:
              - src: resource.jira_project.vdefault#deny-assignee-outside-allowed
                val: This agent may only assign Jira issues to an allowed user. The
                  requested assignee is outside that scope.
      - principal: hermes
        resource: update_verified_disallowed_assignee
        actions: {write: EFFECT_DENY}
        outputs:
          - action: write
            expected:
              - src: resource.jira_project.vdefault#deny-existing-assignee-outside-allowed
                val: This agent may only update/comment/transition Jira issues assigned
                  to an allowed user. This issue is currently assigned to someone
                  outside that scope -- reassign it to an allowed user first.
  - name: issue-type scoping (jiraAllowedIssueTypes is Environment Change/Deploy Service
      Specific/Service Restart, matching test-values.yaml) denies a disallowed issue
      type -- including Task, which is NOT in the allowlist -- whether set on create
      or smuggled into update's fields/additional_fields JSON, allows an allowed ops
      type, and doesn't require one on an ordinary update that doesn't touch issue
      type
    input:
      principals: [hermes]
      resources:
        - create_with_allowed_issue_type
        - create_with_allowed_ops_issue_type
        - create_with_disallowed_issue_type
        - create_with_disallowed_task_issue_type
        - update_with_no_issue_type
        - update_with_smuggled_disallowed_issue_type
      actions: [write]
    expected:
      - principal: hermes
        resource: create_with_allowed_issue_type
        actions: {write: EFFECT_ALLOW}
      - principal: hermes
        resource: create_with_allowed_ops_issue_type
        actions: {write: EFFECT_ALLOW}
      - principal: hermes
        resource: create_with_disallowed_issue_type
        actions: {write: EFFECT_DENY}
      - principal: hermes
        resource: create_with_disallowed_task_issue_type
        actions: {write: EFFECT_DENY}
      - principal: hermes
        resource: update_with_no_issue_type
        actions: {write: EFFECT_ALLOW}
      - principal: hermes
        resource: update_with_smuggled_disallowed_issue_type
        actions: {write: EFFECT_DENY}
