apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-cerbos-shim
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-cerbos-shim
spec:
  replicas: {{ .Values.replicas.mcpCerbosShim }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-cerbos-shim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-cerbos-shim
      annotations:
        checksum/mapping: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-cerbos-shim
          # renovate: datasource=docker depName=harbor.hahomelabs.com/vicegerent/mcp-cerbos-shim
          image: harbor.hahomelabs.com/vicegerent/mcp-cerbos-shim:v0.33.17
          ports:
            - name: grpc
              containerPort: 4445
          env:
            # Secret self-token the shim presents on its own re-entrant lookups
            # so the vmcp-internal backend's CheckRequest gate authenticates them
            # (the app/backend lock; the :81 CiliumNetworkPolicy is the network
            # lock -- see README "Re-Entrant Lookup Path"). Auto-generated by
            # setup-secrets-platform.sh; required, so the pod won't start until
            # the Secret exists (re-run 'vicegerent setup secrets platform').
            - name: SHIM_SELF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-cerbos-shim-self-token
                  key: token
            - name: NOTION_ALLOWED_PARENT_PAGE_IDS  # Scratchpad always implicit, then the team-folder list
              value: {{ prepend (.Values.policy.notion.allowedParentPageIds | default list) .Values.policy.notion.scratchpadPageId | join "," | quote }}
            - name: NOTION_USER_ID
              value: {{ .Values.policy.notion.userId | quote }}
            - name: CONTENT_MODERATION  # "enabled"/"disabled", never "true"/"false" -- see README
              value: {{ .Values.policy.contentSafety.moderation.status | quote }}
            - name: PROMPT_INJECTION_DETECTION  # "enabled"/"disabled" -- see README
              value: {{ .Values.policy.contentSafety.promptInjection.status | quote }}
            - name: PROMPT_INJECTION_JUDGE_MODEL  # stage-2 judge model
              value: {{ .Values.policy.contentSafety.promptInjection.judgeModel | quote }}
            - name: MODERATION_MODEL  # content-moderation classifier model
              value: {{ .Values.policy.contentSafety.moderation.model | quote }}
            - name: MODERATION_WRITE_VERBS  # override valve, empty = shim default
              value: ''
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: mapping
              mountPath: /etc/mcp-cerbos-shim
              readOnly: true
      volumes:
        - name: mapping
          configMap:
            name: mcp-cerbos-shim-mapping
