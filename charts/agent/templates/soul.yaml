---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vicegerent-agent.name" . }}-soul
  namespace: agent-sandbox
data:
  SOUL.md: |-
    {{- $personality := .Values.soul | trimSuffix "\n" }}
    {{- $shared := include "vicegerent-agent.sharedSystemPrompt" . }}
    {{- $hermes := include "vicegerent-agent.hermesInstructions" . }}
    {{- printf "%s\n\n%s\n\n%s" $personality $shared $hermes | nindent 4 }}
