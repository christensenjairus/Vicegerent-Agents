{{- $name := include "vicegerent-agent.name" . -}}
{{- range $claim := list
      (dict "name" "data" "size" $.Values.storage.data)
      (dict "name" "gitrepos" "size" $.Values.storage.gitrepos)
      (dict "name" "models" "size" $.Values.storage.models "excludeFromBackup" true) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim.name }}-{{ $name }}
  namespace: agent-sandbox
  {{- if $claim.excludeFromBackup }}
  labels:
    velero.io/exclude-from-backup: 'true'
  {{- end }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  # Hardcoded, not values-driven -- csi-hostpath-sc is the cluster's only StorageClass.
  storageClassName: csi-hostpath-sc
  resources:
    requests:
      storage: {{ $claim.size }}
{{- end }}
