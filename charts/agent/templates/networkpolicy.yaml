---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "vicegerent-agent.name" . }}-egress
  namespace: agent-sandbox
spec:
  endpointSelector:
    matchLabels:
      vicegerent.io/dashboard: {{ include "vicegerent-agent.name" . }}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
          rules:
            dns:
              - matchName: egress-proxy.egress-proxy.svc.cluster.local
              - matchName: agentgateway-proxy.agentgateway-system.svc.cluster.local
              - matchName: victoria-logs-server.victoria-logs.svc.cluster.local
              {{- if .Values.directEgress.slackFQDNs }}
              {{- range .Values.directEgress.slackFQDNs }}
              - matchName: {{ . }}
              {{- end }}
              {{- end }}
              {{- if .Values.directEgress.edgeTtsFQDNs }}
              {{- range .Values.directEgress.edgeTtsFQDNs }}
              - matchName: {{ . }}
              {{- end }}
              {{- end }}
              {{- range $fqdn, $host := .Values.directEgress.ssh.hosts }}
              - matchName: {{ $fqdn }}
              {{- range (get (default dict $host) "cnameChain" | default list) }}
              - matchName: {{ . }}
              {{- end }}
              {{- end }}
    # All HTTP(S) traffic — to internet, agentgateway, and searxng — routes through
    # the scrubbing proxy. Secrets are redacted before reaching any destination.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: egress-proxy
            app.kubernetes.io/name: egress-proxy
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
    # Slack uses Socket Mode (WSS) + POST Web API — bypass the GET-only proxy.
    # Restricted to exactly the FQDNs slack-bolt needs; wildcard *.slack.com removed.
    #
    # slack.com          — Web API (slack.com/api/*): auth.test, chat.postMessage,
    #                      apps.connections.open, reactions.*, files.*, users.info, etc.
    # wss-primary.slack.com — Socket Mode WebSocket endpoint (primary)
    # wss-backup.slack.com  — Socket Mode WebSocket endpoint (failover)
    # files.slack.com    — File/image downloads when the agent reads attachments
    #
    # NOTE: if Slack rotates the WSS hostname (rare but possible), Socket Mode will
    # fail to reconnect and you'll see apps.connections.open succeed but the WSS
    # connection refused. Add the new hostname here; _sandbox.tpl's no_proxy already
    # carries the suffix form `.slack.com` and needs no edit.
    {{- if .Values.directEgress.slackFQDNs }}
    - toFQDNs:
        {{- range .Values.directEgress.slackFQDNs }}
        - matchName: {{ . }}
        {{- end }}
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
    {{- end }}
    # edge-tts (tts.provider: edge) speaks WSS to speech.platform.bing.com -- same
    # GET-only-proxy-can't-handle-it reasoning as the Slack bypass above. Opt-in only
    # (directEgress.edgeTtsFQDNs empty by default): text sent here leaves the
    # scrubbing proxy's redaction/logging entirely.
    {{- if .Values.directEgress.edgeTtsFQDNs }}
    - toFQDNs:
        {{- range .Values.directEgress.edgeTtsFQDNs }}
        - matchName: {{ . }}
        {{- end }}
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
    {{- end }}
    # SSH bypasses the HTTP proxy — direct egress for git push/pull. Each hosts map key is a
    # connection FQDN. Its cnameChain lists only intermediate DNS aliases because Cilium's
    # toFQDNs DNS proxy strips a CNAME answer unless every name in the chain is allowlisted.
    {{- if .Values.directEgress.ssh.hosts }}
    - toFQDNs:
        {{- range $fqdn, $host := .Values.directEgress.ssh.hosts }}
        - matchName: {{ $fqdn }}
        {{- range (get (default dict $host) "cnameChain" | default list) }}
        - matchName: {{ . }}
        {{- end }}
        {{- end }}
      toPorts:
        - ports:
            - port: '22'
              protocol: TCP
    {{- end }}
