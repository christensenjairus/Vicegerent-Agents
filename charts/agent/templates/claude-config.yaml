---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vicegerent-agent.name" . }}-claude-config
  namespace: agent-sandbox
data:
  # DISABLE_NONESSENTIAL_TRAFFIC below: Claude Code's own telemetry/statsig/error-reporting
  # calls api.anthropic.com directly and ignores ANTHROPIC_BASE_URL (that only covers the Messages API client).
  settings.json: |-
    {
      "env": {
        "ANTHROPIC_BASE_URL": "http://agentgateway-proxy.agentgateway-system.svc.cluster.local/anthropic",
        "ANTHROPIC_AUTH_TOKEN": "none",
        "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
        "MCP_TIMEOUT": "90000",
        "MCP_TOOL_TIMEOUT": "90000"
      },
      "model": "{{ .Values.harnesses.claudeCode }}",
      "enableAllProjectMcpServers": true,
      "permissions": {
        "allow": ["mcp__mnemosyne", "mcp__vmcp"],
        "deny": ["WebSearch", "WebFetch"],
        "defaultMode": "bypassPermissions"
      },
      "sandbox": {
        "enabled": false
      },
      "theme": "dark",
      "skipDangerousModePermissionPrompt": true
    }
  claude.json: |-
    {
      "mcpServers": {
        "mnemosyne": {
          "type": "stdio",
          "command": "/opt/hermes/.venv/bin/mnemosyne",
          "args": ["mcp"]
        },
        "vmcp": {
          "type": "stdio",
          "command": "/usr/local/bin/vmcp-stdio-bridge",
          "args": ["http://agentgateway-proxy.agentgateway-system.svc.cluster.local/mcp/vmcp"],
          "env": {
            "HTTP_PROXY": "http://egress-proxy.egress-proxy.svc.cluster.local:8080",
            "HTTPS_PROXY": "http://egress-proxy.egress-proxy.svc.cluster.local:8080",
            "http_proxy": "http://egress-proxy.egress-proxy.svc.cluster.local:8080",
            "https_proxy": "http://egress-proxy.egress-proxy.svc.cluster.local:8080"
          }
        }
      },
      "projects": {
        "/workspace": {
          "hasTrustDialogAccepted": true
        },
        "/workspace/vicegerent-agents": {
          "hasTrustDialogAccepted": true
        },
        "/opt/hermes": {
          "hasTrustDialogAccepted": true
        }
      }
    }
  CLAUDE.md: |-
{{ include "vicegerent-agent.codingHarnessSystemPrompt" . | trim | indent 4 }}

{{ include "vicegerent-agent.claudeVmcpParallelToolCalls" . | trim | indent 4 }}
