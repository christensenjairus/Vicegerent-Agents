---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  FORCE_COLOR: "3"
  PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
  RENOVATE_BASE_DIR: $CI_PROJECT_DIR/renovate
  RENOVATE_CACHE_PRIVATE_PACKAGES: "true"
  RENOVATE_ENDPOINT: https://gitlab.hahomelabs.com/api/v4/
  RENOVATE_EXTRA_FLAGS: ""
  RENOVATE_GIT_AUTHOR: Renovate Bot <noreply@hahomelabs.com>
  RENOVATE_OPTIMIZE_FOR_DISABLED: "true"
  RENOVATE_PLATFORM: gitlab
  RENOVATE_REPOSITORIES: '["jchristensen/vicegerent-agents"]'
  RENOVATE_REPOSITORY_CACHE: enabled
  LOG_LEVEL: info
  DOCKER_CONFIG: $CI_PROJECT_DIR/.docker

stages: [generate, validate, publish, scan]

generate:host-brew-formulae:
  stage: generate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: false
  resource_group: host-brew-generate-$CI_MERGE_REQUEST_IID
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE != "merge_train" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\//
      changes:
        - host/brew/packages.json
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache ca-certificates curl git python3
  script:
    - |
      test "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" = "$CI_PROJECT_ID" || {
        echo "CI cannot push generated formulae to a forked merge request." >&2
        exit 1
      }
    - git fetch --no-tags origin "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - git checkout --detach FETCH_HEAD
    - python3 host/brew/generate.py
    - python3 -m unittest host.brew.test_generate host.brew.test_reconcile
    - python3 host/brew/reconcile.py validate
    - |
      if test -z "$(git status --porcelain -- Formula host/brew/packages.json)"; then
        echo "Managed Homebrew formulae already match the Renovate update."
        exit 0
      fi
      unexpected="$(git status --porcelain | cut -c4- | grep -Ev '^(Formula/.+\.rb|host/brew/packages\.json)$' || true)"
      test -z "$unexpected" || { echo "Generator changed unexpected files:" >&2; printf '%s\n' "$unexpected" >&2; exit 1; }
      git config user.name "Vicegerent CI"
      git config user.email "vicegerent-ci@hahomelabs.com"
      git add Formula host/brew/packages.json
      git commit -m "chore(brew): generate versioned formulae"
      git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "HEAD:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
      curl --fail --silent --show-error --request POST \
        --form "token=${CI_JOB_TOKEN}" \
        --form "ref=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" \
        --form "variables[GENERATED_CHANGE]=host-brew-formulae" \
        --form "variables[MR_DIFF_BASE_SHA]=${CI_MERGE_REQUEST_DIFF_BASE_SHA}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"

validate:pre-commit:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: true
  variables:
    TOOLS_CACHE_DIR: $CI_PROJECT_DIR/.cache/ci-tools
    KUBECONFORM_CACHE: $CI_PROJECT_DIR/.cache/kubeconform
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
    # renovate: datasource=github-releases depName=mikefarah/yq
    YQ_VERSION: v4.53.3
    # renovate: datasource=github-releases depName=yannh/kubeconform
    KUBECONFORM_VERSION: v0.8.0
    # renovate: datasource=github-releases depName=cerbos/cerbos
    CERBOS_VERSION: v0.54.0

  cache:
    key:
      prefix: validation-cache-yq${YQ_VERSION}-kubeconform${KUBECONFORM_VERSION}-cerbos${CERBOS_VERSION}
      files:
        - .pre-commit-config.yaml
        - uv.lock
    paths:
      - .cache/pre-commit/
      - .cache/kubeconform/
      - .cache/ci-tools/
      - .cache/uv/
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" && $GENERATED_CHANGE == "host-brew-formulae"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash curl git python3 py3-pip tar
    - mkdir -p "$TOOLS_CACHE_DIR"
    - |
      if [ ! -x "$TOOLS_CACHE_DIR/yq" ]; then
        curl -sLo "$TOOLS_CACHE_DIR/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
        chmod +x "$TOOLS_CACHE_DIR/yq"
      fi
    - |
      if [ ! -x "$TOOLS_CACHE_DIR/kubeconform" ]; then
        curl -sLo /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
        tar -xzf /tmp/kubeconform.tar.gz -C "$TOOLS_CACHE_DIR" kubeconform
      fi
    - |
      if [ ! -x "$TOOLS_CACHE_DIR/cerbos" ]; then
        curl -sLo /tmp/cerbos.tar.gz "https://github.com/cerbos/cerbos/releases/download/${CERBOS_VERSION}/cerbos_${CERBOS_VERSION#v}_Linux_x86_64.tar.gz"
        tar -xzf /tmp/cerbos.tar.gz -C "$TOOLS_CACHE_DIR" cerbos
      fi
    - chmod +x "$TOOLS_CACHE_DIR"/{yq,kubeconform,cerbos}
    - export PATH="$TOOLS_CACHE_DIR:$PATH"
    - source scripts/lib/python-env.sh && ensure_python_environment "$CI_PROJECT_DIR"
  script:
    - |
      if test "$CI_PIPELINE_SOURCE" = "merge_request_event" &&
        test "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" = "$CI_PROJECT_ID"; then
        git fetch --no-tags origin "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        source_head="$(git rev-parse FETCH_HEAD)" || { echo "Cannot resolve fetched MR head." >&2; exit 1; }
        test -n "$source_head" || { echo "Fetched MR head is empty." >&2; exit 1; }
        if test "$source_head" != "$CI_COMMIT_SHA"; then
          echo "Skipping validation for superseded MR head $CI_COMMIT_SHA."
          exit 0
        fi
      fi
      pre-commit run --all-files --show-diff-on-failure

validate:shim-go-test:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/library/golang:1.26
  interruptible: true
  variables:
    GOPATH: $CI_PROJECT_DIR/.cache/go
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    # renovate: datasource=github-releases depName=helm/helm
    HELM_VERSION: v4.2.3
  cache:
    key:
      prefix: shim-go
      files:
        - images/mcp-cerbos-shim/go.sum
    paths:
      - .cache/go/pkg/mod/
      - .cache/go-build/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - images/mcp-cerbos-shim/**/*
        - host/mcp/toolhive-servers.json
        - charts/mcp-cerbos-shim/**/*
        - values.defaults.yaml
        - values.example.yaml
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - when: never
  before_script:
    - curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
    - install /tmp/linux-amd64/helm /usr/local/bin/helm
  script:
    - cd images/mcp-cerbos-shim
    - test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
    - go vet ./...
    - go test ./...

validate:agentgateway-crds:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: true
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  cache:
    key:
      files: [uv.lock]
    paths: [.cache/uv/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - charts/platform/**/*
        - values.defaults.yaml
        - values.example.yaml
        - stages/stages.yaml
        - scripts/validate-agentgateway*.{sh,py}
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash python3 py3-pip
  script:
    - bash scripts/validate-agentgateway.sh

validate:image-tag-bump:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - images/**/*
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache curl git python3
  script:
    - git fetch --no-tags origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - python3 scripts/validate-image-tags.py --bump-since "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - |
      if ! git diff --quiet; then
        if [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; then
          echo "Image tags were bumped, but CI cannot push to a forked merge request." >&2
          git diff --stat >&2
          exit 1
        fi
        git config user.name "Vicegerent CI"
        git config user.email "vicegerent-ci@hahomelabs.com"
        git add -u
        git commit -m "chore(images): bump tags"
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
          "HEAD:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        curl --fail --silent --show-error --request POST \
          --form "token=${CI_JOB_TOKEN}" \
          --form "ref=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" \
          --form "variables[GENERATED_CHANGE]=image-tags" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"
      fi

validate:tag-bump-head:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" && $GENERATED_CHANGE == "image-tags"
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache python3
  script:
    - python3 scripts/validate-image-tags.py

validate:host-brew-formulae:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" && $GENERATED_CHANGE == "host-brew-formulae"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Formula/**/*
        - host/brew/**/*
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache ca-certificates git python3
  script:
    - |
      if test "$CI_PIPELINE_SOURCE" = "merge_request_event" &&
        test "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" = "$CI_PROJECT_ID"; then
        git fetch --no-tags origin "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        source_head="$(git rev-parse FETCH_HEAD)" || { echo "Cannot resolve fetched MR head." >&2; exit 1; }
        test -n "$source_head" || { echo "Fetched MR head is empty." >&2; exit 1; }
        if test "$source_head" != "$CI_COMMIT_SHA"; then
          echo "Skipping formula verification for superseded MR head $CI_COMMIT_SHA."
          exit 0
        fi
      fi
    - |
      base_revision="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$MR_DIFF_BASE_SHA}"
      test -n "$base_revision" || { echo "MR diff base SHA is required." >&2; exit 1; }
      git fetch --no-tags origin "$base_revision"
      python3 host/brew/generate.py --verify --changed-since "$base_revision"
    - python3 -m unittest host.brew.test_generate host.brew.test_reconcile
    - python3 host/brew/reconcile.py validate

validate:renovate-config:
  stage: validate
  image: harbor.hahomelabs.com/ghcr.io/renovatebot/renovate:44.14.3
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - when: never
  script:
    - renovate-config-validator renovate.json

.image-publish:
  stage: publish
  tags: [laptop-image-build]
  interruptible: true
  variables:
    DOCKER_BUILDKIT: "1"
  before_script:
    - test -n "$DOCKER_AUTH_CONFIG" || { echo "DOCKER_AUTH_CONFIG is required to publish images." >&2; exit 1; }
    - mkdir -p "$DOCKER_CONFIG"
    - printf '%s' "$DOCKER_AUTH_CONFIG" > "$DOCKER_CONFIG/config.json"
    - chmod 0600 "$DOCKER_CONFIG/config.json"
  after_script:
    - rm -rf "$DOCKER_CONFIG"
  script:
    - test -n "$IMAGE_DIR" || { echo "IMAGE_DIR is required to publish images." >&2; exit 1; }
    - |
      if [ "$CI_COMMIT_BRANCH" = "development" ]; then
        make -C "$IMAGE_DIR" release TAG="dev-${CI_COMMIT_SHA}"
      else
        make -C "$IMAGE_DIR" release
      fi

image:publish:aws-api-mcp-server:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/aws-api-mcp-server/**/*]
  script:
    - make -C images/aws-api-mcp-server release

image:publish:aws-profiles-mcp:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/aws-profiles-mcp/**/*]
  script:
    - make -C images/aws-profiles-mcp release

image:publish:agent:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/agent/**/*]
  script:
    - make -C images/agent release

image:publish:kubernetes-mcp-server:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/kubernetes-mcp-server/**/*]
  script:
    - make -C images/kubernetes-mcp-server release

image:publish:mcp-cerbos-shim:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/mcp-cerbos-shim/**/*]
  script:
    - make -C images/mcp-cerbos-shim release

# Explicit retry path for a failed main publication. It rebuilds the current immutable
# release tags; it does not mint versions or alter deployment references.
image:republish:all:
  extends: .image-publish
  resource_group: image-republish-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
    - when: never
  script:
    - |
      for image_dir in \
        images/aws-api-mcp-server \
        images/aws-profiles-mcp \
        images/agent \
        images/kubernetes-mcp-server \
        images/mcp-cerbos-shim; do
        make -C "$image_dir" release
      done

scan:renovate:
  stage: scan
  image: harbor.hahomelabs.com/ghcr.io/renovatebot/renovate:44.14.3
  resource_group: renovate-main
  interruptible: false
  needs: []
  before_script:
    - test -n "$DOCKER_AUTH_CONFIG" || { echo "DOCKER_AUTH_CONFIG is required for Renovate registry lookups." >&2; exit 1; }
    - mkdir -p "$DOCKER_CONFIG"
    - printf '%s' "$DOCKER_AUTH_CONFIG" > "$DOCKER_CONFIG/config.json"
    - chmod 0600 "$DOCKER_CONFIG/config.json"
  after_script:
    - rm -rf "$DOCKER_CONFIG"
  cache:
    key: renovate-cache-v1
    paths:
      - renovate/cache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: never
  script:
    - renovate-config-validator renovate.json
    - renovate $RENOVATE_EXTRA_FLAGS
