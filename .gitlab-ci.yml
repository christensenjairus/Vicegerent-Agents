---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  FORCE_COLOR: "3"
  PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
  RENOVATE_BASE_DIR: $CI_PROJECT_DIR/renovate
  RENOVATE_CACHE_PRIVATE_PACKAGES: "true"
  RENOVATE_ENDPOINT: https://gitlab.hahomelabs.com/api/v4/
  RENOVATE_EXTRA_FLAGS: ""
  RENOVATE_GIT_AUTHOR: Renovate Bot <noreply@hahomelabs.com>
  RENOVATE_OPTIMIZE_FOR_DISABLED: "true"
  RENOVATE_PLATFORM: gitlab
  RENOVATE_REPOSITORIES: '["jchristensen/vicegerent-agents"]'
  RENOVATE_REPOSITORY_CACHE: enabled
  LOG_LEVEL: info
  DOCKER_CONFIG: $CI_PROJECT_DIR/.docker

stages: [validate, publish, scan]

validate:pre-commit:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: true
  variables:
    TOOLS_CACHE_DIR: $CI_PROJECT_DIR/.cache/ci-tools
    KUBECONFORM_CACHE: $CI_PROJECT_DIR/.cache/kubeconform
    # renovate: datasource=github-releases depName=mikefarah/yq
    YQ_VERSION: v4.53.3
    # renovate: datasource=github-releases depName=yannh/kubeconform
    KUBECONFORM_VERSION: v0.8.0
    # renovate: datasource=github-releases depName=cerbos/cerbos
    CERBOS_VERSION: v0.54.0
    # renovate: datasource=pypi depName=pre-commit
    PRE_COMMIT_VERSION: 4.6.1
    # renovate: datasource=pypi depName=detect-secrets
    DETECT_SECRETS_VERSION: 1.5.0
  cache:
    key:
      prefix: validation-cache-yq${YQ_VERSION}-kubeconform${KUBECONFORM_VERSION}-cerbos${CERBOS_VERSION}
      files:
        - .pre-commit-config.yaml
    paths:
      - .cache/pre-commit/
      - .cache/kubeconform/
      - .cache/ci-tools/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash curl git python3 py3-pip tar 2>/dev/null || true
    - mkdir -p "$TOOLS_CACHE_DIR"
    - |
      if [ ! -x "$TOOLS_CACHE_DIR/yq" ]; then
        curl -sLo "$TOOLS_CACHE_DIR/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
        chmod +x "$TOOLS_CACHE_DIR/yq"
      fi
    - |
      if [ ! -x "$TOOLS_CACHE_DIR/kubeconform" ]; then
        curl -sLo /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
        tar -xzf /tmp/kubeconform.tar.gz -C "$TOOLS_CACHE_DIR" kubeconform
      fi
    - |
      if [ ! -x "$TOOLS_CACHE_DIR/cerbos" ]; then
        curl -sLo /tmp/cerbos.tar.gz "https://github.com/cerbos/cerbos/releases/download/${CERBOS_VERSION}/cerbos_${CERBOS_VERSION#v}_Linux_x86_64.tar.gz"
        tar -xzf /tmp/cerbos.tar.gz -C "$TOOLS_CACHE_DIR" cerbos
      fi
    - chmod +x "$TOOLS_CACHE_DIR"/{yq,kubeconform,cerbos}
    - export PATH="$TOOLS_CACHE_DIR:$PATH"
    - pip install "pre-commit==$PRE_COMMIT_VERSION" "detect-secrets==$DETECT_SECRETS_VERSION" --break-system-packages --quiet
  script:
    - pre-commit run --all-files --show-diff-on-failure

validate:shim-go-test:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/library/golang:1.26
  interruptible: true
  variables:
    GOPATH: $CI_PROJECT_DIR/.cache/go
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  cache:
    key:
      prefix: shim-go
      files:
        - images/mcp-cerbos-shim/go.sum
    paths:
      - .cache/go/pkg/mod/
      - .cache/go-build/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - images/mcp-cerbos-shim/**/*
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - when: never
  script:
    - cd images/mcp-cerbos-shim
    - test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
    - go vet ./...
    - go test ./...

validate:agentgateway-crds:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: true
  variables:
    # renovate: datasource=pypi depName=jsonschema
    JSONSCHEMA_VERSION: 4.26.0
    # renovate: datasource=pypi depName=PyYAML
    PYYAML_VERSION: 6.0.3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - charts/platform/**/*
        - values.defaults.yaml
        - values.example.yaml
        - stages/stages.yaml
        - scripts/validate-agentgateway*.{sh,py}
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache python3 py3-pip 2>/dev/null || true
    - pip install "jsonschema==$JSONSCHEMA_VERSION" "PyYAML==$PYYAML_VERSION" --break-system-packages --quiet
  script:
    - bash scripts/validate-agentgateway.sh

validate:image-tag-bump:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE != "merge_train"
      changes:
        - images/**/*
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache curl git python3 2>/dev/null || true
  script:
    - git fetch --no-tags origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    # A merged-results pipeline checks out a synthetic merge commit. Mutate only
    # the real source head, or the generated commit would absorb target changes.
    - source_sha="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
    - git fetch --no-tags origin "$source_sha"
    - git checkout --detach "$source_sha"
    - python3 scripts/validate-image-tags.py --bump-since "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - |
      if ! git diff --quiet; then
        if [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; then
          echo "Image tags were bumped, but CI cannot push to a forked merge request." >&2
          git diff --stat >&2
          exit 1
        fi
        git config user.name "Vicegerent CI"
        git config user.email "vicegerent-ci@hahomelabs.com"
        git add -u
        git commit -m "chore(images): bump tags"
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
          "HEAD:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        curl --fail --silent --show-error --request POST \
          --form "token=${CI_JOB_TOKEN}" \
          --form "ref=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"
      fi

# Read-only final gate: the synthetic target parent includes every earlier train
# car, so a reused sequential tag fails before GitLab can merge it.
validate:image-tag-train:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache git python3 2>/dev/null || true
  script:
    - python3 scripts/validate-image-tags.py --train-since

validate:tag-bump-head:
  stage: validate
  image: harbor.hahomelabs.com/docker.io/alpine/k8s:1.36.2
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache python3 2>/dev/null || true
  script:
    - python3 scripts/validate-image-tags.py

validate:renovate-config:
  stage: validate
  image: harbor.hahomelabs.com/ghcr.io/renovatebot/renovate:43.281.1
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - when: never
  script:
    - renovate-config-validator renovate.json

.image-publish:
  stage: publish
  tags: [laptop-image-build]
  interruptible: true
  variables:
    DOCKER_BUILDKIT: "1"
  before_script:
    - test -n "$DOCKER_AUTH_CONFIG" || { echo "DOCKER_AUTH_CONFIG is required to publish images." >&2; exit 1; }
    - mkdir -p "$DOCKER_CONFIG"
    - printf '%s' "$DOCKER_AUTH_CONFIG" > "$DOCKER_CONFIG/config.json"
    - chmod 0600 "$DOCKER_CONFIG/config.json"
  after_script:
    - rm -rf "$DOCKER_CONFIG"
  script:
    - test -n "$IMAGE_DIR" || { echo "IMAGE_DIR is required to publish images." >&2; exit 1; }
    - |
      if [ "$CI_COMMIT_BRANCH" = "development" ]; then
        make -C "$IMAGE_DIR" release TAG="dev-${CI_COMMIT_SHA}"
      else
        make -C "$IMAGE_DIR" release
      fi

image:publish:agentgateway:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/agentgateway-proxy/**/*]
  script:
    - make -C images/agentgateway-proxy release

image:publish:aws-api-mcp-server:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/aws-api-mcp-server/**/*]
  script:
    - make -C images/aws-api-mcp-server release

image:publish:aws-profiles-mcp:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/aws-profiles-mcp/**/*]
  script:
    - make -C images/aws-profiles-mcp release

image:publish:hermes:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/hermes/**/*]
  script:
    - make -C images/hermes release

image:publish:kubernetes-mcp-server:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/kubernetes-mcp-server/**/*]
  script:
    - make -C images/kubernetes-mcp-server release

image:publish:mcp-cerbos-shim:
  extends: .image-publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [images/mcp-cerbos-shim/**/*]
  script:
    - make -C images/mcp-cerbos-shim release

# Explicit retry path for a failed main publication. It rebuilds the current immutable
# release tags; it does not mint versions or alter deployment references.
image:republish:all:
  extends: .image-publish
  resource_group: image-republish-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
    - when: never
  script:
    - |
      for image_dir in \
        images/agentgateway-proxy \
        images/aws-api-mcp-server \
        images/aws-profiles-mcp \
        images/hermes \
        images/kubernetes-mcp-server \
        images/mcp-cerbos-shim; do
        make -C "$image_dir" release
      done

scan:renovate:
  stage: scan
  image: harbor.hahomelabs.com/ghcr.io/renovatebot/renovate:43.281.1
  resource_group: renovate-main
  interruptible: false
  needs: []
  cache:
    key: renovate-cache-v1
    paths:
      - renovate/cache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: never
  script:
    - renovate-config-validator renovate.json
    - renovate $RENOVATE_EXTRA_FLAGS
