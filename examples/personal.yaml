---
# Personal machine overrides. Omitted settings inherit values.defaults.yaml.
policy:
  sourceControl:
    github:
      allowedRepos:
        - christensenjairus/vicegerent-agents
        - christensenjairus/clustercreator
      username: christensenjairus
    gitlab:
      allowedProjects: ['7', '148', '150']
      username: jchristensen
  workManagement:
    jira:
      allowedProjects: [CHANGE]
    linear:
      allowedTeams: [91f312b9-73e9-45ea-8b80-4d3a1ef7aff9, HAHomelabs, HAH]
  dataAccess:
    grafana:
      deniedDatasourceUids: [fess5o6x6evb4b]
      deniedDatasourceNames: [dev-opensearch-datasource]
  notion:
    scratchpadPageId: 393de8859710809c9f5ec57a91d2c81a
    allowedParentPageIds: [1ccde885971080989baffe615ee5922b]
    userId: 80ef9a06-7ab7-4479-b971-effdd3aa247c
  alertmanager:
    maxSilenceSeconds: 1209600
    createdBy: jchristensen
agents:
  - name: hermes
    obsidian:
      vaultPath: /workspace/knowledge-vault
    git:
      userName: jchristensen
      userEmail: christensenjairus@gmail.com
    timezone: America/Denver
    providers:
      openai:
        model: gpt-5.6-terra
        auxiliaryModel: gpt-5.6-luna
        mnemosyneModel: gpt-4o-mini
      deepseek:
        enabled: true
      zai:
        enabled: true
    mnemosyne:
      provider: openai
    failover:
      provider: anthropic
      model: claude-sonnet-5
    directEgress:
      ssh:
        fqdn: gitlab.hahomelabs.com
        cnameChain: [uw1-ddns.hahomelabs.com, uw1-hahomelabs.ddns.net]
      slackFQDNs:
        - slack.com
        - wss-primary.slack.com
        - wss-backup.slack.com
        - files.slack.com
      edgeTtsFQDNs: [speech.platform.bing.com]
    config:
      model:
        default: gpt-5.6-terra
        provider: openai-api
      model_aliases:
        sol:
          model: gpt-5.6-sol
          provider: openai-api
        terra:
          model: gpt-5.6-terra
          provider: openai-api
        luna:
          model: gpt-5.6-luna
          provider: openai-api
      delegation:
        model: gpt-5.6-terra
        provider: openai-api
      auxiliary:
        vision:
          model: gpt-5.6-luna
          provider: openai-api
        title_generation:
          model: gpt-5.6-luna
          provider: openai-api
        approval:
          model: gpt-5.6-luna
          provider: openai-api
        compression:
          model: gpt-5.6-luna
          provider: openai-api
        web_extract:
          model: gpt-5.6-luna
          provider: openai-api
        triage_specifier:
          model: gpt-5.6-luna
          provider: openai-api
        kanban_decomposer:
          model: gpt-5.6-luna
          provider: openai-api
        curator:
          model: gpt-5.6-luna
          provider: openai-api
        monitor:
          model: gpt-5.6-luna
          provider: openai-api
      agent:
        system_prompt: You are a technical expert. Provide detailed, accurate technical
          information.
        disabled_toolsets: [computer_use, browser, image_gen]
      tts:
        provider: edge
    soul: |-
      # Personality
      You are a pragmatic senior engineer with strong taste.
      You optimize for truth, clarity, and usefulness over politeness theater. You may occasionally swear colorfully when frustrated.

      ## Style
      - Be direct without being cold
      - Prefer substance over filler
      - Push back when something is a bad idea
      - Admit uncertainty plainly
      - Keep explanations compact unless depth is useful

      ## What to avoid
      - Sycophancy
      - Hype language
      - Repeating the user's framing if it's wrong
      - Overexplaining obvious things

      ## Technical posture
      - Prefer simple systems over clever systems
      - Care about operational reality, not idealized architecture
      - Treat edge cases as part of the design, not cleanup

      ## Tools
      - You have live MCP tools via the vMCP (kubernetes, plus whatever the operator enabled: gitlab, tavily, firecrawl, notion, linear, ...)
      - When a task needs external data or a real action, search your available tools for the right one and use it
      - Don't guess, hand-wave, or give up when a tool could get the real answer
egress:
  wildcardDomains: [github.com, githubusercontent.com]
  exactDomains:
    - pypi.org
    - files.pythonhosted.org
    - proxy.golang.org
    - sum.golang.org
    - storage.googleapis.com
replicas:
  agentgatewayProxy: 2
  mcpCerbosShim: 2
  searxng: 2
  cerbos: 2
  egressProxy: 2
