---
# Real-world machine values, deltas only -- see values.defaults.yaml for the full
# annotated menu of every setting and its default. The installer layers that file
# under this one, so only the overrides for this machine appear here.
clusterVars:
  githubAllowedRepos:
    - moveworks-emu/moveworks
    - moveworks-emu/k8s-manifests
    - moveworks-emu/sec
    - jchristensen_movester/moveworks
    - jchristensen_movester/k8s-manifests
    - christensenjairus/vicegerent-agents
    - jchristensen_movester/Knowledge-Vault
  githubForkRequiredOwners: [moveworks-emu]
  githubForkOwners: [jchristensen_movester]
  githubUsername: jchristensen_movester
  jiraAllowedProjects: [CHANGE]
  jiraAllowedAssignees: [jchristensen@moveworks.ai]
  jiraAllowedIssueTypes:
    - Environment Change
    - Deploy Service Specific
    - Service Restart
  linearAllowedTeams:
    - 6deab0c5-9bda-4f82-b552-41f4aa9e449b
    - DevOps
    - DEVOPS
  # Email for a caller-set `assignee`; display name for the live-resolved get_issue path.
  linearAllowedAssignees: [jchristensen@moveworks.ai, Jairus Christensen]
  pagerdutyAllowedServiceIds: [PJD41LB, PV3S4O5, PORBNK3, P7X89U2]
  grafanaDeniedDatasourceUids: [fess5o6x6evb4b]
  grafanaDeniedDatasourceNames: [dev-opensearch-datasource]
  elasticDeniedIndexPatterns: [snowflake]
  notionScratchpadPageId: 1ea588d8909f80edb0cef38d0aeaf64f
  notionAllowedParentPageIds:
    - 6fc3f07af7084089a14088581502e3f1
    - 1de588d8909f80458ad6c0a831284768
    - 306588d8909f806d9e78f7004cf3b9db
    - 41348461628a472bbc16c14e2e866a89
  notionUserId: 1ded872b-594c-813d-aa2c-000228ba9671
  contentModeration: enabled
  promptInjectionDetection: enabled
  alertmanagerCreatedBy: jchristensen
agents:
  - name: hermes
    obsidian:
      vaultPath: /workspace/knowledge-vault
    git:
      userName: jchristensen_movester
      userEmail: jchristensen@moveworks.ai
    timezone: America/Denver
    networkAllowlist:
      cnameChainedFQDN: gitlab.hahomelabs.com
      cnameChain: uw1-ddns.hahomelabs.com,uw1-hahomelabs.ddns.net
      slackFQDNs:
        - slack.com
        - wss-primary.slack.com
        - wss-backup.slack.com
        - files.slack.com
    config: |-
      model:
        provider: anthropic
      agent:
        system_prompt: You are a technical expert. Provide detailed, accurate technical information.
    soul: |-
      # Personality
      You are a pragmatic senior engineer with strong taste.
      You optimize for truth, clarity, and usefulness over politeness theater. You may occasionally swear colorfully when frustrated.

      ## Style
      - Be direct without being cold
      - Prefer substance over filler
      - Push back when something is a bad idea
      - Admit uncertainty plainly
      - Keep explanations compact unless depth is useful

      ## What to avoid
      - Sycophancy
      - Hype language
      - Repeating the user's framing if it's wrong
      - Overexplaining obvious things

      ## Technical posture
      - Prefer simple systems over clever systems
      - Care about operational reality, not idealized architecture
      - Treat edge cases as part of the design, not cleanup

      ## Tools
      - You have live MCP tools via the vMCP (kubernetes, plus whatever the operator enabled: gitlab, tavily, firecrawl, notion, linear, ...)
      - When a task needs external data or a real action, search your available tools for the right one and use it
      - Don't guess, hand-wave, or give up when a tool could get the real answer
egress:
  apexWildcardDomains: github.com,githubusercontent.com
  exactOnlyDomains: pypi.org,files.pythonhosted.org,proxy.golang.org,sum.golang.org,storage.googleapis.com,artifactory.global.mgmt.moveworks.io
  internalAllowlistCIDRs: 10.230.0.0/16
# Defaults render all four model backends; this machine drops deepseek and zai.
models:
  deepseek:
    enabled: false
  zai:
    enabled: false
