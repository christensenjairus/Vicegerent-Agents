---
# Work machine overrides. Omitted settings inherit values.defaults.yaml.
policy:
  sourceControl:
    github:
      allowedRepos:
        - moveworks-emu/moveworks
        - moveworks-emu/k8s-manifests
        - moveworks-emu/sec
        - jchristensen_movester/moveworks
        - jchristensen_movester/k8s-manifests
        - christensenjairus/vicegerent-agents
        - jchristensen_movester/Knowledge-Vault
      forkRequiredOwners: [moveworks-emu]
      forkOwners: [jchristensen_movester]
      username: jchristensen_movester
    gitlab:
      allowedProjects: ['148']
      username: jchristensen
  workManagement:
    jira:
      allowedProjects: [CHANGE]
      allowedAssignees: [jchristensen@moveworks.ai]
      allowedIssueTypes:
        - Environment Change
        - Deploy Service Specific
        - Service Restart
    linear:
      allowedTeams:
        - 6deab0c5-9bda-4f82-b552-41f4aa9e449b
        - DevOps
        - DEVOPS
      # Include both the caller-facing email and the display name returned by live lookup.
      allowedAssignees: [jchristensen@moveworks.ai, Jairus Christensen]
    pagerduty:
      allowedServiceIds: [PJD41LB, PV3S4O5, PORBNK3, P7X89U2]
  dataAccess:
    grafana:
      deniedDatasourceUids: [fess5o6x6evb4b]
      deniedDatasourceNames: [dev-opensearch-datasource]
    elastic:
      deniedIndexPatterns: [snowflake]
  notion:
    scratchpadPageId: 1ea588d8909f80edb0cef38d0aeaf64f
    allowedParentPageIds:
      - 6fc3f07af7084089a14088581502e3f1
      - 1de588d8909f80458ad6c0a831284768
      - 306588d8909f806d9e78f7004cf3b9db
      - 41348461628a472bbc16c14e2e866a89
    userId: 1ded872b-594c-813d-aa2c-000228ba9671
  contentSafety:
    moderation:
      status: enabled
    promptInjection:
      status: enabled
  alertmanager:
    createdBy: jchristensen
agents:
  - name: hermes
    obsidian:
      vaultPath: /workspace/knowledge-vault
    git:
      userName: Jairus Christensen
      userEmail: jchristensen@moveworks.ai
    timezone: America/Denver
    providers:
      openai:
        model: gpt-5.6-terra
        auxiliaryModel: gpt-5.6-luna
        mnemosyneModel: gpt-4o-mini
    mnemosyne:
      provider: openai
    failover:
      provider: anthropic
      model: claude-sonnet-5
    moa:
      aggregator:
        provider: openai
        models:
          default: gpt-5.6-terra
          frontier: gpt-5.6-sol
    directEgress:
      ssh:
        fqdn: gitlab.hahomelabs.com
        cnameChain: [uw1-ddns.hahomelabs.com, uw1-hahomelabs.ddns.net]
      slackFQDNs:
        - slack.com
        - wss-primary.slack.com
        - wss-backup.slack.com
        - files.slack.com
    config:
      model:
        default: gpt-5.6-terra
        provider: openai-api
      delegation:
        model: gpt-5.6-terra
        provider: openai-api
      auxiliary:
        vision:
          model: gpt-5.6-luna
          provider: openai-api
        title_generation:
          model: gpt-5.6-luna
          provider: openai-api
        approval:
          model: gpt-5.6-luna
          provider: openai-api
        compression:
          model: gpt-5.6-luna
          provider: openai-api
        web_extract:
          model: gpt-5.6-luna
          provider: openai-api
        triage_specifier:
          model: gpt-5.6-luna
          provider: openai-api
        kanban_decomposer:
          model: gpt-5.6-luna
          provider: openai-api
        curator:
          model: gpt-5.6-luna
          provider: openai-api
        monitor:
          model: gpt-5.6-luna
          provider: openai-api
      agent:
        system_prompt: You are a technical expert. Provide detailed, accurate technical
          information.
    soul: |-
      # Personality
      You are a pragmatic senior engineer with strong taste.
      You optimize for truth, clarity, and usefulness over politeness theater. You may occasionally swear colorfully when frustrated.

      ## Style
      - Be direct without being cold
      - Prefer substance over filler
      - Push back when something is a bad idea
      - Admit uncertainty plainly
      - Keep explanations compact unless depth is useful

      ## What to avoid
      - Sycophancy
      - Hype language
      - Repeating the user's framing if it's wrong
      - Overexplaining obvious things

      ## Technical posture
      - Prefer simple systems over clever systems
      - Care about operational reality, not idealized architecture
      - Treat edge cases as part of the design, not cleanup

      ## Tools
      - You have live MCP tools via the vMCP (kubernetes, plus whatever the operator enabled: gitlab, tavily, firecrawl, notion, linear, ...)
      - When a task needs external data or a real action, search your available tools for the right one and use it
      - Don't guess, hand-wave, or give up when a tool could get the real answer
egress:
  wildcardDomains: [github.com, githubusercontent.com]
  exactDomains:
    - pypi.org
    - files.pythonhosted.org
    - proxy.golang.org
    - sum.golang.org
    - storage.googleapis.com
    - artifactory.global.mgmt.moveworks.io
  internalAllowedCIDRs: [10.230.0.0/16]
# Defaults render all four model backends; this machine drops deepseek and zai.
models:
  deepseek:
    enabled: false
  zai:
    enabled: false
replicas:
  agentgatewayProxy: 2
  mcpCerbosShim: 2
  searxng: 2
  cerbos: 2
  egressProxy: 2
