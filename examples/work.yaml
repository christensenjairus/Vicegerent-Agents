    - files.pythonhosted.org
    - proxy.golang.org
    - sum.golang.org
    - storage.googleapis.com
    - artifactory.global.mgmt.moveworks.io
  # Artifactory resolves into this range; include every internal range reached by an
  # allowed hostname.
  internalAllowedCIDRs: [10.230.0.0/16]
replicas:
  agentgatewayProxy: 2
  mcpCerbosShim: 2
  searxng: 2
  cerbos: 2
  egressProxy: 2
