---
# Upstream default values:
# https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-logs-single/values.yaml
nameOverride: victoria-logs
server:
  image:
    repository: victoriametrics/victoria-logs
    tag: v1.52.0
  retentionPeriod: 7d
  extraArgs:
    retention.maxDiskSpaceUsageBytes: 5GiB
  persistentVolume:
    size: 10Gi
    storageClassName: csi-hostpath-sc
    extraLabels:
      velero.io/exclude-from-backup: 'true'
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  podAnnotations:
    reloader.stakater.com/auto: 'false' # opt out of reloader autoReloadAll
vector:
  enabled: true
  role: Agent
  image:
    repository: timberio/vector
    tag: 0.57.0-debian
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
  customConfig:
    data_dir: /vector-data-dir
    api:
      enabled: false
      address: 0.0.0.0:8686
    sources:
      k8s:
        type: kubernetes_logs
        pod_annotation_fields:
          # Disable "pod_ips" as "pod_ip" already includes required info
          pod_ips: ''
    transforms:
      scope:
        type: filter
        inputs: [k8s]
        condition:
          type: vrl
          source: |
            ns = to_string(.kubernetes.pod_namespace) ?? ""
            pod = to_string(.kubernetes.pod_name) ?? ""
            container = to_string(.kubernetes.container_name) ?? ""
            pod_app_label = to_string(.kubernetes.pod_labels."app.kubernetes.io/name") ?? ""
            sandbox_agent = to_string(.kubernetes.pod_labels."vicegerent.io/dashboard") ?? ""
            (ns == "kube-system" && pod_app_label == "tetragon" && container == "export-stdout") ||
            (ns == "agentgateway-system" && starts_with(pod, "agentgateway-proxy-") && container == "agentgateway") ||
            (ns == "agent-sandbox" && sandbox_agent != "" && container == "agent") ||
            (ns == "egress-proxy" && container == "mitmproxy")
      parser:
        type: remap
        inputs: [scope]
        source: |
          .log = parse_json(.message) ?? .message
          if is_object(.log) {
            if is_object(.log.process_exec) {
              p = .log.process_exec.process
              binary = to_string(p.binary) ?? "?"
              args = to_string(p.arguments) ?? ""
              .message = "process_start: " + binary + " " + args
            }
          }
      # Redactor regexes are GENERATED from the canonical secret-patterns.json (the same
      # file the shim embeds and the egress-proxy/promptGuard legs render from) by
      # scripts/gen-vector-redactor.py; validate.sh runs it in --check mode to block drift.
      redactor:
        type: remap
        inputs: [parser]
        source: |
          # BEGIN GENERATED redactor (scripts/gen-vector-redactor.py from images/mcp-cerbos-shim/internal/server/secret-patterns.json — do not edit; run: python3 scripts/gen-vector-redactor.py)
          .message = replace!(.message, r'-----BEGIN (?:RSA |EC |OPENSSH |DSA |ED25519 |ENCRYPTED )?PRIVATE KEY-----[\s\S]+?-----END (?:RSA |EC |OPENSSH |DSA |ED25519 |ENCRYPTED )?PRIVATE KEY-----', "<masked>", count: -1)
          .message = replace(.message, r'xox[bpraescd]-[A-Za-z0-9\-_]+', "<masked>", count: -1)
          .message = replace(.message, r'xapp-[A-Za-z0-9\-_]+', "<masked>", count: -1)
          .message = replace(.message, r'(?i)\bBearer[ \t]+[A-Za-z0-9\-._~+/]+=*', "<masked>", count: -1)
          .message = replace(.message, r'(?i)\bBasic[ \t]+[A-Za-z0-9+/]+=*', "<masked>", count: -1)
          .message = replace(.message, r'\b(?:AKIA|ASIA|AROA|AIDA)[A-Z0-9]{16}\b', "<masked>", count: -1)
          .message = replace(.message, r'\bgh[pousr]_[A-Za-z0-9]{36,255}\b', "<masked>", count: -1)
          .message = replace(.message, r'\bglpat-[A-Za-z0-9_\-]{20,}\b', "<masked>", count: -1)
          .message = replace(.message, r'\bAIza[A-Za-z0-9_\-]{35}\b', "<masked>", count: -1)
          .message = replace(.message, r'\bsk-(?:proj-)?[A-Za-z0-9_\-]{20,}\b', "<masked>", count: -1)
          .message = replace(.message, r'\bsk-ant-[A-Za-z0-9_\-]{20,}\b', "<masked>", count: -1)
          .message = replace(.message, r'\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}\b', "<masked>", count: -1)
          .message = replace(.message, r'\bntn_[A-Za-z0-9]{20,}\b', "<masked>", count: -1)
          .message = replace(.message, r'\bSK[a-f0-9]{32}\b', "<masked>", count: -1)
          .message = replace(.message, r'\bnpm_[A-Za-z0-9]{36}\b', "<masked>", count: -1)
          .message = replace(.message, r'\beyJ[A-Za-z0-9_\-]+\.eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\b', "<masked>", count: -1)
          .message = replace(.message, r'(?i)\bSSWS[ \t]+00[A-Za-z0-9_\-]{40}', "<masked>", count: -1)
          .message = replace(.message, r'\bATATT[A-Za-z0-9_\-=]{20,}', "<masked>", count: -1)
          .message = replace(.message, r'\bATCTT[A-Za-z0-9_\-+/=]{20,}', "<masked>", count: -1)
          .message = replace(.message, r'\bdapi[a-f0-9]{32}(?:-[0-9])?', "<masked>", count: -1)
          .message = replace(.message, r'(?i)\bAccountKey[ \t]*=[ \t]*[A-Za-z0-9+/]{86}==', "<masked>", count: -1)
          .message = replace(.message, r'\b[A-Za-z0-9_~.]{3}[0-9]Q~[A-Za-z0-9_~.\-]{31,34}', "<masked>", count: -1)
          .message = replace(.message, r'(?i)\bApiKey[ \t]+[A-Za-z0-9+/]{32,}={0,2}', "<masked>", count: -1)
          .message = replace(.message, r'(?i)\b(?:postgres(?:ql)?|redis|rediss|amqps?|mongodb(?:\+srv)?|clickhouse|mysql):\/\/[A-Za-z0-9._~%\-]{1,128}:[^@/\s"]{6,256}@', "<masked>", count: -1)
          .message = replace(.message, r'\bgithub_pat_[0-9A-Za-z_]{82}', "<masked>", count: -1)
          .message = replace(.message, r'\bAKCp[A-Za-z0-9]{69}', "<masked>", count: -1)
          .message = replace(.message, r'\bcmVmdGtu[A-Za-z0-9+/=]{20,}', "<masked>", count: -1)
          .message = replace(.message, r'\bglsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8}', "<masked>", count: -1)
          .message = replace(.message, r'\bglc_[A-Za-z0-9+/]{32,}={0,3}', "<masked>", count: -1)
          .message = replace(.message, r'\bdckr_pat_[A-Za-z0-9_\-]{20,}', "<masked>", count: -1)
          .message = replace(.message, r'\bpypi-[A-Za-z0-9_\-]{60,}', "<masked>", count: -1)
          .message = replace(.message, r'\bhf_[A-Za-z0-9]{34}', "<masked>", count: -1)
          .message = replace(.message, r'\bops_eyJ[A-Za-z0-9_\-]{100,}={0,2}', "<masked>", count: -1)
          .message = replace(.message, r'\blin_api_[A-Za-z0-9]{40}', "<masked>", count: -1)
          .message = replace(.message, r'(?i)\bToken[ \t]+token=[A-Za-z0-9_+\-]{16,}', "<masked>", count: -1)
          .message = replace(.message, r'\b(?:0(?:0[1-9]|[1-9][0-9])|[1-5][0-9]{2}|6(?:[0-5][0-9]|6[0-57-9]|[7-9][0-9])|[78][0-9]{2})-(?:0[1-9]|[1-9][0-9])-(?:000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-9][0-9]{3})\b', "<masked>", count: -1)
          .message = replace(.message, r'\b4(?:[0-9]{12}|[0-9]{15}|[0-9]{18})\b', "<masked>", count: -1)
          .message = replace(.message, r'\b(?:5[1-5][0-9]{14}|(?:222[1-9]|22[3-9][0-9]|2[3-6][0-9]{2}|27[01][0-9]|2720)[0-9]{12})\b', "<masked>", count: -1)
          .message = replace(.message, r'\b3[47][0-9]{13}\b', "<masked>", count: -1)
          .message = replace(.message, r'\b(?:6011[0-9]{12}|65[0-9]{14}|64[4-9][0-9]{13}|622(?:12[6-9]|1[3-9][0-9]|[2-8][0-9]{2}|9(?:[01][0-9]|2[0-5]))[0-9]{10})\b', "<masked>", count: -1)
          .message = replace(.message, r'(?:\+?1[-.\s]?)?(?:\([0-9]{3}\)[-.\s]?|[0-9]{3}[-.\s])[0-9]{3}[-.\s][0-9]{4}\b', "<masked>", count: -1)
          # END GENERATED redactor
    sinks:
      vlogs:
        type: elasticsearch
        inputs: [redactor]
        mode: bulk
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        request:
          headers:
            VL-Time-Field: timestamp
            VL-Stream-Fields: stream,kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_namespace
            VL-Msg-Field: message,msg,_msg,log.msg,log.message,log
            AccountID: '0'
            ProjectID: '0'
