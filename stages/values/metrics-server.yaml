---
# https://github.com/kubernetes-sigs/metrics-server/blob/metrics-server-helm-chart-3.13.1/charts/metrics-server/values.yaml
image:
  repository: registry.k8s.io/metrics-server/metrics-server
  tag: v0.9.0
# Kind's kubelet serves metrics with a self-signed cert the cluster CA can't verify.
args: [--kubelet-insecure-tls]
