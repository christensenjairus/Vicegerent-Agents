---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - https://github.com/kubernetes-csi/external-snapshotter//deploy/kubernetes/snapshot-controller?ref=v8.6.0
patches:
  - target:
      kind: Deployment
      name: snapshot-controller
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
