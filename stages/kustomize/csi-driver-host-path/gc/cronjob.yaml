---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: csi-hostpath-gc
spec:
  # Native CronJob rejects a CRON_TZ=/TZ= prefix in schedule; timeZone is the
  # separate field for it. Keep this clear of the 13:00 velero-vicegerent-daily
  # backup (stages/values/velero.yaml) so it never pauses the plugin mid-backup.
  schedule: 0 6 * * *
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: csi-hostpath-gc
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Every retry pod must restore the plugin before pruning. A failed
            # earlier reconcile can leave it scaled down after its own retry
            # budget, which would make the plugin images appear unused.
            - name: restore-csi-driver
              image: alpine/k8s:1.36.2
              command: [/bin/sh, /scripts/restore-csi-driver.sh]
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
            # Node image pruning rides along on this job for its schedule, but
            # must not run *beside* the reconcile: that scales csi-hostpathplugin
            # to zero, and a concurrent prune would see the plugin's own images
            # as unreferenced. An initContainer finishes while every live
            # workload still pins its image.
            - name: prune-node-images
              # The mounted crictl is dynamically linked against the node's
              # glibc, so this base must be glibc and no older than the node's
              # Debian release. Under a musl base the loader is absent and the
              # binary fails to exec as a bare "not found".
              image: debian:trixie-slim
              command: [/bin/sh, /scripts/prune-node-images.sh]
              securityContext:
                # containerd's socket is root:root 0660, so root alone suffices.
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: crictl
                  mountPath: /host/bin/crictl
                  readOnly: true
                - name: containerd-socket
                  mountPath: /run/containerd/containerd.sock
          containers:
            - name: reconcile
              # renovate: datasource=docker depName=alpine/k8s
              image: alpine/k8s:1.36.2
              command: [/bin/sh, /scripts/reconcile.sh]
              securityContext:
                # csi-hostpath's volume directories have mixed-UID owners; root
                # needs DAC_OVERRIDE (not the default-dropped ALL) to delete them.
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                  add: [DAC_OVERRIDE]
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: csi-data-dir
                  mountPath: /csi-data-dir
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: csi-hostpath-gc-scripts
                defaultMode: 0555
            - name: csi-data-dir
              hostPath:
                path: /var/lib/csi-hostpath-data/
                type: Directory
            - name: tmp
              emptyDir: {}
            # kind's node image is the only source of crictl here; no image this
            # repo pins ships one.
            - name: crictl
              hostPath:
                path: /usr/local/bin/crictl
                type: File
            - name: containerd-socket
              hostPath:
                path: /run/containerd/containerd.sock
                type: Socket
