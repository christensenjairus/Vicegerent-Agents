---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-hostpath-gc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-hostpath-gc-reader
rules:
  - apiGroups: ['']
    resources: [persistentvolumes]
    verbs: [get, list]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-hostpath-gc-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-hostpath-gc-reader
subjects:
  - kind: ServiceAccount
    name: csi-hostpath-gc
    namespace: csi-hostpath-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: csi-hostpath-gc-plugin-restart
rules:
  # resourceNames scopes this to the one StatefulSet the GC job restarts.
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [csi-hostpathplugin]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: csi-hostpath-gc-plugin-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: csi-hostpath-gc-plugin-restart
subjects:
  - kind: ServiceAccount
    name: csi-hostpath-gc
