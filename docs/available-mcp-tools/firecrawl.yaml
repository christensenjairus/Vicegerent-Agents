    tools:
      firecrawl_scrape:
        description: "Retrieve and extract content from one supplied URL through Firecrawl. Use this when the request identifies a page and needs its content or defined fields. It can return markdown, HTML, links, screenshots, branding data, a targeted answer, or JSON matching a supplied schema; JSON is useful when the requested result has defined fields, while markdown preserves readable page content. This tool operates on a known page. For a set of pages use `firecrawl_crawl`, and to discover page URLs use `firecrawl_map` or `firecrawl_search`. Options include JavaScript render delay, cache age, main-content filtering, PII redaction, and lockdown cache-only retrieval. Browser actions may change the live page when interactive actions are enabled. Firecrawl may reuse recently indexed content instead of refetching the page, and the reuse window varies by domain. Set `maxAge: 0` to force a live fetch, or a smaller `maxAge` to bound how stale reused content may be. A successful response does not by itself confirm that the state it describes is still current. Returns the selected content formats and page metadata."
        arguments:
          actions:
            type: "array"
            required: false
          excludeTags:
            type: "array"
            required: false
          formats:
            type: "array"
            required: false
          includeTags:
            type: "array"
            required: false
          jsonOptions:
            type: "object"
            required: false
          location:
            type: "object"
            required: false
          lockdown:
            type: "boolean"
            required: false
          maxAge:
            type: "number"
            required: false
          mobile:
            type: "boolean"
            required: false
          onlyMainContent:
            type: "boolean"
            required: false
