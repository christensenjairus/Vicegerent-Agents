            required: false
          allowSubdomains:
            type: "boolean"
            required: false
          crawlEntireDomain:
            type: "boolean"
            required: false
          deduplicateSimilarURLs:
            type: "boolean"
            required: false
          delay:
            type: "number"
            required: false
          excludePaths:
            type: "array"
            required: false
          ignoreQueryParameters:
            type: "boolean"
            required: false
          includePaths:
            type: "array"
            required: false
          limit:
            type: "number"
            required: false
          maxConcurrency:
            type: "number"
