      firecrawl_monitor_create:
        description: "Create a recurring scrape, crawl, or search monitor that compares each check with its retained predecessor. The simple form accepts `page`/`pages` or `queries` plus a plain-language `goal`; the advanced `body` form controls targets, schedule, change-tracking formats, judging, retention, webhook, and notifications. In the simple form, a `goal` is required. If `queries` contains one or more non-empty values and is supplied with `page`/`pages`, `queries` create the search target and page targets are ignored. A monitor schedules future network checks and can send configured email or webhook notifications. Returns the created monitor."
        arguments:
          body:
            type: "object"
            required: false
          email:
            type: "string"
            required: false
          excludeDomains:
            type: "array"
            required: false
          goal:
            type: "string"
            required: false
          includeDiffs:
