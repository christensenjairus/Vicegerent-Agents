      firecrawl_research_search_papers:
        description: "For topics represented in the indexed corpus, search paper metadata and abstracts with a natural-language query. Optional author, category, and date filters constrain results. Returns ranked papers with canonical IDs, titles, authors, and abstracts."
        arguments:
          authors:
            type: "array"
            required: false
            description: "Author substring filter(s); ALL must match (case-insensitive)."
          categories:
            type: "array"
            required: false
            description: "Paper category filter(s) (e.g. `cs.LG`); ALL provided values must match."
          from:
            type: "string"
            required: false
            description: "Inclusive lower bound on created/updated date (`YYYY-MM-DD`)."
          k:
            type: "integer"
            required: false
            description: "Number of ranked papers to return (default 40)."
          query:
            type: "string"
            required: true
            description: "Natural-language research topic or question, including methods, systems, conditions, populations, interventions, or outcomes when relevant."
          to:
            type: "string"
            required: false
            description: "Inclusive upper bound on created/updated date (`YYYY-MM-DD`)."
      firecrawl_research_inspect_paper:
        description: "Retrieve canonical metadata for one paper ID, such as an arXiv, PMC, PMID, or DOI identifier. Returns the title, abstract, authors, categories, source IDs, and dates as markdown."
        arguments:
          paperId:
            type: "string"
            required: true
            description: "Canonical paperId or primaryId such as `arxiv:1706.03762`, `pmcid:PMC12530322`, `pmid:40953549`, or `doi:10.1016/j.neunet.2025.108095`."
      firecrawl_research_related_papers:
        description: "Find citation-graph candidates from one to ten `seed_ids`; the first ID is the primary seed and later IDs are anchors. `mode` defaults to `similar` (co-citation/bibliographic coupling); `citers` returns papers citing a seed and `references` papers cited by a seed. `intent` ranks candidates. Returns ranked candidates and the evaluated pool size."
        arguments:
          intent:
            type: "string"
            required: true
          k:
            type: "integer"
            required: false
          mode:
            type: "string"
            required: false
            enum: ["similar", "citers", "references"]
          rerank:
            type: "boolean"
            required: false
            description: "Apply an additional rerank over the fused candidates."
          seed_ids:
            type: "array"
            required: true
      firecrawl_research_read_paper:
        description: "Retrieve in-body passages from one paper that are relevant to a specific question. Full text is available only for indexed papers; `k` controls the number of passages. Returns matching passages or a notice when full text is unavailable."
        arguments:
          k:
            type: "integer"
            required: false
            description: "Number of passages to return (default 4)."
          paperId:
            type: "string"
            required: true
            description: "Canonical paperId or primaryId such as `arxiv:1706.03762`, `pmcid:PMC12530322`, `pmid:40953549`, or `doi:10.1016/j.neunet.2025.108095`."
