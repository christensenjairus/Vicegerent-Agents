          queryOptions:
            type: "object"
            required: false
          redactPII:
            type: "boolean"
            required: false
          removeBase64Images:
            type: "boolean"
            required: false
          screenshotOptions:
            type: "object"
            required: false
          skipTlsVerification:
            type: "boolean"
