            required: false
          query:
            type: "string"
            required: true
      firecrawl_developer_search:
        description: "For a developer question - code behaviour, a library or framework, an API contract, an error message, or a known bug - search an index built for coding agents. The index covers GitHub issues, merged pull requests, repository READMEs, and curated documentation sites. Set skills to \"only\" to limit the search to agent-skill files. Returns ranked results with an ID, source type, URL, title, and the matched passages in markdown."
        arguments:
          k:
            type: "integer"
            required: false
            description: "Number of ranked results to return (default 10)."
          query:
            type: "string"
            required: true
            description: "Natural-language developer question or search phrase, including the library, error message, or API involved when relevant."
          skills:
            type: "string"
            required: false
            description: "Set to \"only\" to search only agent-skill files."
            enum: ["only"]
