      firecrawl_map:
        description: "Enumerate URLs indexed under one website through Firecrawl without fetching each page's content. Use this when the request asks for a site's URL inventory, when several relevant pages must be located, or when the desired page URL is unknown. An optional `search` term narrows the URL list, while sitemap, subdomain, query-parameter, and result-limit options control coverage. Returns matching URLs rather than page bodies. Retrieve one page with `firecrawl_scrape`; collect content across multiple pages with `firecrawl_crawl`."
        arguments:
          ignoreQueryParameters:
            type: "boolean"
            required: false
          includeSubdomains:
            type: "boolean"
            required: false
          limit:
            type: "number"
            required: false
          search:
            type: "string"
            required: false
          sitemap:
            type: "string"
            required: false
            enum: ["include", "skip", "only"]
          url:
            type: "string"
            required: true
      firecrawl_search:
        description: "Search web, news, or image sources and return ranked results. Operators include quoted phrases, `-term`, `site:host`, `inurl:term`, `intitle:term`, and `related:host`; the set is non-exhaustive. `includeDomains` and `excludeDomains` are mutually exclusive hostname filters; categories limit results to GitHub, research, PDF, or developer sources. For a programming question, add `categories: [\"developer\"]`. It searches an index of GitHub issues, merged pull requests, repository READMEs, and curated documentation sites, and returns the hits in `data.developer` beside the web results. `scrapeOptions` can attach extracted page content; pages fetched this way use a fixed reuse window and ignore `maxAge`, so use `firecrawl_scrape` when a live fetch is required. Returns source-type result groups and usage metadata. Authenticated responses can include an `id` for optional search feedback."
        arguments:
          categories:
            type: "array"
            required: false
            description: "Limit results to specific source types. `github` searches GitHub repositories, code, issues, and docs; `research` searches academic and research sources; `pdf` searches PDF results; `developer` searches an index built for coding agents over GitHub issues, merged pull requests, repository READMEs, and curated documentation sites. `developer` adds a `data.developer` group of `{ url, title, description }` results, where `description` holds the matched passage; the other categories filter `data.web`."
          enterprise:
            type: "array"
            required: false
          excludeDomains:
            type: "array"
            required: false
          filter:
            type: "string"
            required: false
          highlights:
            type: "boolean"
            required: false
            description: "Return query-relevant highlights for each search result. Set to false to keep the original search snippets."
          includeDomains:
            type: "array"
            required: false
          limit:
            type: "number"
            required: false
          location:
            type: "string"
            required: false
          query:
            type: "string"
            required: true
          scrapeOptions:
            type: "object"
            required: false
          sources:
            type: "array"
            required: false
          tbs:
            type: "string"
            required: false
      firecrawl_search_feedback:
        description: "Records schema-validated quality feedback for a prior `firecrawl_search` UUID `searchId`. A `good` rating requires a valuable source, `partial` a valuable source or at least one `missingContent` entry, and `bad` at least one `missingContent` entry or a query suggestion; caps are 50 `valuableSources` and 20 `missingContent` entries. Eligibility is limited to successful searches within the feedback age window. The record is idempotent per search ID. Eligible first feedback for a search can refund 1 credit; refunds are subject to the team's daily cap. The response reports whether a refund was applied, along with submission and daily-cap status."
