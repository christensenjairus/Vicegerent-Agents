          tags:
            type: "array"
            required: false
          url:
            type: "string"
            required: false
          valuableSources:
            type: "array"
            required: false
      firecrawl_crawl:
        description: "Start a multi-page crawl at a website URL, poll it to a terminal state, and return the final status and collected data. Scope can be bounded with include/exclude paths, depth, page limit, subdomain/external-link controls, sitemap handling, delay, and scrape options. Crawl results can be large; use conservative limits when full-site coverage is unnecessary. Webhooks and interactive scrape actions are unavailable in safe mode. Returns the crawl ID, status, and page data."
        arguments:
