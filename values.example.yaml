---
# Copy this deltas-only example to the gitignored values.yaml and customize it for your machine. Omitted settings inherit values.defaults.yaml; secrets are provisioned separately with `./vicegerent setup secrets`.
# See examples/ for complete personal and work configurations.
# Machine-wide authorization and identity
policy:
  sourceControl:
    github:
  # GitHub owner/repo pairs agents may write to, and this machine's GitHub login.
      allowedRepos: [your-org/your-repo]
      username: your-github-username
  # GitLab projects agents may act on (reads included). Prefer numeric ids;
  # plain path forms are resolved before matching, but percent-encoded paths are unsupported.
    gitlab:
      allowedProjects: ['12345']
      username: your-gitlab-username
  # Linear live lookups return display names, so include every form of an identity.
  workManagement:
    jira:
      allowedProjects: [PROJ]
      allowedAssignees: [you@example.com]
    linear:
      allowedTeams: [your-linear-team-uuid, YourTeam, TEAM]
      allowedAssignees: [you@example.com, Your Name]
  # Notion Scratchpad page, and this machine's Notion user id (deny-not-own-page gate).
  notion:
    scratchpadPageId: your-notion-scratchpad-page-id
    userId: your-notion-user-id
  # Empty Grafana and Elastic denylists impose no restriction. Empty notionAllowedParentPageIds keeps writes Scratchpad-only.
  # This machine's fixed Alertmanager silence-creator identity.
  alertmanager:
    createdBy: your-username
# One chart release per agent, up to ten. Dashboard NodePorts use 30119-30128 in list order.
agents:
  - name: my-first-agent
    obsidian:
      vaultPath: /workspace/knowledge-vault
    git:
      userName: your-name
      userEmail: you@example.com
    # Defaults enable anthropic + openai; this agent is anthropic-only.
    providers:
      openai:
        enabled: false
    # Disable the OpenAI failover alongside the provider.
    failover:
      provider: ''
    # Cilium requires every intermediate CNAME in the chain.
    directEgress:
      ssh:
        fqdn: git.example.com
        cnameChain: [ddns-a.example.com, ddns-b.example.net]
      slackFQDNs:
        - slack.com
        - wss-primary.slack.com
        - wss-backup.slack.com
        - files.slack.com
    config:
      model:
        provider: anthropic
      agent:
        system_prompt: You are a technical expert. Provide detailed, accurate technical
          information.
    # Personality and voice only; the chart appends its fixed environment guidance.
    soul: |-
      # Personality
      You are a pragmatic senior engineer with strong taste. You optimize for truth,
      clarity, and usefulness over politeness theater.

      ## Style
      - Be direct without being cold
      - Push back when something is a bad idea
      - Admit uncertainty plainly
egress:
  wildcardDomains: [github.com, githubusercontent.com]
  exactDomains:
    - pypi.org
    - files.pythonhosted.org
    - proxy.golang.org
    - sum.golang.org
    - storage.googleapis.com
# Render only the Anthropic platform backend.
models:
  openai:
    enabled: false
  deepseek:
    enabled: false
  zai:
    enabled: false
