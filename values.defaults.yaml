---
# Canonical platform defaults. The installer layers the machine's gitignored values.yaml over this file; values.example.yaml and examples/ are mostly deltas-only machine configurations, with selected defaults restated when their intended profile behavior should remain explicit.
#
# Maps merge recursively, but lists replace their defaults. Empty allowlists deny access; empty denylists impose no restriction; ['*'] disables a supported allowlist check, while documented data-access denylists use it to deny all.
# Machine-wide authorization, safety, and operational policy.
policy:
  sourceControl:
    github:
      # Compared case-insensitively; empty denies all writes.
      allowedRepos: []
      # Owners requiring fork-qualified PR heads and the allowed fork owners.
      forkRequiredOwners: ['*']
      forkOwners: ['*']
      # Login used by the live PR-author gate.
      username: ''

    # GitLab reads and writes are scoped together. Prefer numeric ids because paths break when a project moves.
    gitlab:
      allowedProjects: []
      # Login belonging to this machine's GitLab token.
      username: ''
  workManagement:
    # Jira reads are unrestricted; empty allowedProjects denies all writes.
    jira:
      allowedProjects: []
      # ['*'] disables the corresponding check.
      allowedAssignees: ['*']
      allowedIssueTypes: ['*']

    # Include each team's UUID, display name, and key because callers may use any of them.
    linear:
      allowedTeams: []
      # Include every identity form; live lookups return display names. 'me' is always valid.
      allowedAssignees: ['*']

    # ['*'] permits every PagerDuty service.
    pagerduty:
      allowedServiceIds: ['*']
  dataAccess:
    # Grafana datasources agents may not read, matched by uid or name; ['*'] denies all.
    grafana:
      deniedDatasourceUids: []
      deniedDatasourceNames: []

    # Elastic index and datastream tokens agents may not read (substring match); ['*'] denies all.
    elastic:
      deniedIndexPatterns: []
  notion:
    # Scratchpad is the only implicit allowed parent for page creation.
    scratchpadPageId: ''
    # Additional parents for page updates and comments.
    allowedParentPageIds: []
    # Operator identity used by the live page-author gate.
    userId: ''

  # Content safety. Use enabled/disabled, not booleans. Both features require the OpenAI backend and provider.
  contentSafety:
    moderation:
      status: disabled
      model: omni-moderation-latest
    promptInjection:
      status: disabled
      judgeModel: gpt-4.1-mini
  alertmanager:
    # A non-positive cap denies all silence creation; an empty creator denies all deletion.
    maxSilenceSeconds: 86400
    createdBy: ''

  # Tavily/Firecrawl crawl and map caps.
  webCrawl:
    maxLimit: 200
    maxDepth: 3
    maxBreadth: 50
# One stable Cloudflare Tunnel HTTPS origin is shared by every configured agent route.
webhooks:
  publicUrl: ''
  # UUID of the locally-managed Cloudflare tunnel that serves publicUrl.
  tunnelId: ''
# Per-agent defaults. The installer layers this template under each machine agent. A machine supports at most ten agents; their dashboards use NodePorts 30119-30128 in list order.
agentDefaults:
  image:
    # renovate: datasource=docker depName=harbor.hahomelabs.com/vicegerent/agent
    repository: harbor.hahomelabs.com/vicegerent/agent
    tag: v2026.8.3-rev45
  storage:
    data: 10Gi
    gitRepos: 50Gi
    # Mnemosyne weights are reseeded from the image and excluded from Velero backup.
    models: 2Gi
  obsidian:
    # Absolute self-saving vault path under /opt/data or /workspace; empty disables Obsidian.
    vaultPath: ''
  git:
    # Global commit identity; empty leaves git without an author identity.
    userName: ''
    userEmail: ''
  # IANA timezone for timestamps and scheduling.
  timezone: America/Los_Angeles
  # Each provider defines its primary, auxiliary, memory-consolidation, and MoA tier models.
  # reasoningEffort overrides the global tuning.reasoningEffort fallback when enabled.
  providers:
    anthropic:
      enabled: true
      model: claude-sonnet-5
      reasoningEffort: medium
      auxiliaryModel: claude-haiku-4-5
      mnemosyneModel: claude-haiku-4-5
      aliases:
        haiku: claude-haiku-4-5
        sonnet: claude-sonnet-5
        opus: claude-opus-5
        fable: claude-fable-5
      moaModels:
        balanced: claude-sonnet-5
        frontier: claude-opus-5
    openai:
      enabled: true
      model: gpt-5.4
      reasoningEffort: medium
      auxiliaryModel: gpt-4o-mini
      mnemosyneModel: gpt-4o-mini
      aliases:
        sol: gpt-5.6-sol
        terra: gpt-5.6-terra
        luna: gpt-5.6-luna
      moaModels:
        balanced: gpt-5.4
        frontier: gpt-5.6-sol
    deepseek:
      enabled: false
      model: deepseek-v4-pro
      reasoningEffort: high
      auxiliaryModel: deepseek-v4-flash
      mnemosyneModel: deepseek-v4-flash
      moaModels:
        balanced: deepseek-v4-pro
        frontier: deepseek-v4-pro
    zai:
      enabled: false
      model: glm-5.2
      reasoningEffort: high
      auxiliaryModel: glm-4.7-flash
      mnemosyneModel: glm-4.7-flash
      moaModels:
        balanced: glm-5.2
        frontier: glm-5.2
  # Fixed standalone coding-harness models.
  harnesses:
    claudeCode: claude-opus-5
    codex: gpt-5.6-sol
    openCode: gpt-5.6-sol
  # Enabled provider used for memory consolidation.
  mnemosyne:
    provider: anthropic
  # Empty model inherits the provider model; empty provider disables failover.
  failover:
    provider: openai
    model: ''
  # Explicit MoA aggregator; provider uses the values key, not the Hermes runtime ID.
  moa:
    aggregator:
      provider: anthropic
      models:
        default: claude-sonnet-5
        frontier: claude-opus-5
  # Direct SSH bypasses the HTTP proxy. Map each allowed connection hostname to
  # only its intermediate DNS CNAMEs; Cilium strips answers with unlisted names.
  directEgress:
    ssh:
      hosts: {}
    # Slack endpoints bypass the GET-only proxy for POST and WebSocket traffic.
    slackFQDNs: []
    # Edge-TTS endpoints bypass the scrubbing proxy.
    edgeTtsFQDNs: []
  # Hermes runtime tuning. The config map below may override these values.
  tuning:
    # Shared primary and compression context window.
    contextLength: 1000000
    compressionThreshold: 0.5
    # Prompt-cache TTL (Go duration string).
    cacheTtl: 1h
    maxTurns: 150
    gatewayTimeoutSeconds: 900
    apiMaxRetries: 5
    reasoningEffort: medium
    maxSpawnDepth: 2
    # Seconds Hermes waits on a clarify prompt before proceeding.
    clarifyTimeoutSeconds: 300
    vmcp:
      timeoutSeconds: 90
      connectTimeoutSeconds: 5
      # Keep the long-lived Streamable HTTP session below vMCP's idle expiry.
      keepaliveIntervalSeconds: 10
    toolLoopGuardrails:
      hardStopEnabled: true
      warnAfterExactFailure: 4
      warnAfterSameToolFailure: 15
      hardStopAfterExactFailure: 12
      hardStopAfterSameToolFailure: 50
  # Personality and voice only; the chart appends fixed environment guidance.
  soul: ''
  # Provider signatures terminate in the shared listener; only route metadata reaches Hermes.
  webhooks:
    enabled: false
    # Hermes toolsets and named MCP servers available to every webhook session.
    # A per-agent list replaces this default; an empty list disables all tools.
    toolsets:
      - terminal
      - file
      - todo
      - vmcp
    # Routes accept provider, enabled, description, events, prompt, skills,
    # filters, script, deliver, deliver_extra, and deliver_only.
    routes: {}
  # Native config map merged over platform defaults and under locked mandatory config.
  config: {}
# Required machine entries. Each entry is layered over agentDefaults.
agents: []
# Shared egress-proxy policy. Wildcard domains also permit the apex.
egress:
  wildcardDomains: []
  exactDomains: []
  internalAllowedCIDRs: []
# Platform model backends and routes. These switches are independent of each agent's provider switches.
models:
  anthropic:
    enabled: true
  openai:
    enabled: true
  # Optional platform backends stay off until a machine config explicitly enables
  # them alongside a matching agent provider route and API key.
  deepseek:
    enabled: false
  zai:
    enabled: false
# Shared component replicas.
replicas:
  agentgatewayProxy: 1
  mcpCerbosShim: 1
  searxng: 1
  cerbos: 1
  egressProxy: 1
